<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://dbymktwxokbvfshlztrg.supabase.co; connect-src https://dbymktwxokbvfshlztrg.supabase.co wss://dbymktwxokbvfshlztrg.supabase.co; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0E6B5B">
<title>CHM 사업장 관리</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="chmsites-192.png">
<link rel="apple-touch-icon" href="chmsites-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CHM Sites">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>

:root{
  --paper:#EBF0EE;--surface:#FFFFFF;--surface-2:#F4F7F6;--ink:#14201D;--ink-2:#4A5955;--ink-3:#7A8884;
  --line:#D5DDDA;--accent:#0E6B5B;--accent-soft:#DCEFE9;--accent-ink:#0A5245;
  --warn:#A65A06;--warn-soft:#FBEBD6;--bad:#B42318;--bad-soft:#FBE4E1;--good:#157A3A;--good-soft:#DDF2E4;
  --stripe:#E3E9E7;--shadow:0 10px 30px rgba(20,32,29,.08);
  --sans:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --paper:#0D1412;--surface:#141D1B;--surface-2:#1A2523;--ink:#E3EBE8;--ink-2:#A8B6B2;--ink-3:#73827E;
  --line:#283532;--accent:#3FBFA3;--accent-soft:#15322B;--accent-ink:#86DCC8;
  --warn:#EFA24C;--warn-soft:#3A2913;--bad:#F07D6F;--bad-soft:#3B1D19;--good:#58D68A;--good-soft:#143322;
  --stripe:#1F2A28;--shadow:0 10px 30px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{color-scheme:dark;
  --paper:#0D1412;--surface:#141D1B;--surface-2:#1A2523;--ink:#E3EBE8;--ink-2:#A8B6B2;--ink-3:#73827E;
  --line:#283532;--accent:#3FBFA3;--accent-soft:#15322B;--accent-ink:#86DCC8;
  --warn:#EFA24C;--warn-soft:#3A2913;--bad:#F07D6F;--bad-soft:#3B1D19;--good:#58D68A;--good-soft:#143322;
  --stripe:#1F2A28;--shadow:0 10px 30px rgba(0,0,0,.35)}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;padding:12px 16px 24px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}

/* 앱 틀 */
.app{container-type:inline-size;background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden;
  height:min(860px,calc(100dvh - 90px));min-height:620px;max-width:1280px;margin-inline:auto;box-shadow:var(--shadow);position:relative}
.app.phone{max-width:390px;height:800px;border-radius:28px;border-width:6px;border-color:var(--ink)}
.shell{display:grid;grid-template-columns:196px 1fr;height:100%}
.nav{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 10px;gap:2px;min-width:0}
.brand{display:flex;align-items:center;gap:9px;padding:2px 8px 16px}
.brand .mk{width:34px;height:34px;flex:none;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:10.5px;letter-spacing:.02em}
.brand b{font-size:14px;line-height:1.2}.brand small{display:block;font-size:11px;color:var(--ink-3)}
.nav button.it{display:flex;align-items:center;gap:10px;border:0;background:none;padding:9px 10px;border-radius:8px;color:var(--ink-2);font-weight:500;text-align:left;width:100%}
.nav button.it:hover{background:var(--surface-2)}
.nav button.it[aria-current="page"]{background:var(--accent-soft);color:var(--accent-ink)}
.nav svg{width:18px;height:18px;flex:none}
.who{margin-top:auto;border-top:1px solid var(--line);padding:12px 8px 0;font-size:12px;color:var(--ink-3);display:grid;gap:6px}
.who b{color:var(--ink);font-size:13px}
.who button{justify-self:start;border:1px solid var(--line);background:none;border-radius:6px;padding:3px 8px;font-size:12px;color:var(--ink-2)}
.main{overflow:auto;min-width:0;position:relative}
.main.fill{overflow:hidden}
.page{padding:22px 24px 40px;display:grid;gap:18px;align-content:start}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ph h1{font-size:21px;font-weight:700;letter-spacing:-.01em}
.ph p{margin:2px 0 0;color:var(--ink-3);font-size:12.5px}

/* 공통 */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.card h3{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;margin-bottom:12px}
.card h3 .r{margin-left:auto}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:500;padding:1px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);white-space:nowrap}
.chip.acc{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent}
.chip.src{background:#EEF2FF;color:#3730A3;border-color:transparent}.chip.src a{color:inherit;text-decoration:none}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.chip.ex{background:none;border-style:dashed;color:var(--ink-3)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.btn:hover{border-color:var(--ink-3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sm{padding:3px 9px;font-size:12px}
.btn svg{width:15px;height:15px}
.muted{color:var(--ink-3)}
.kv{margin:0;display:grid;grid-template-columns:88px 1fr;gap:6px 12px;font-size:13.5px}
.kv dt{color:var(--ink-3)}.kv dd{margin:0}
.ikv{grid-template-columns:104px 1fr}
.icard>summary{list-style:none;cursor:pointer}.icard>summary::-webkit-details-marker{display:none}.icard>summary h3{margin-bottom:0}.icard[open]>summary h3{margin-bottom:12px}
.icard>summary h3::before{content:'▸';color:var(--ink-3);font-size:11px;transition:transform .15s}.icard[open]>summary h3::before{transform:rotate(90deg)}
.ilabel{margin:2px 0 8px}.isep{border:0;border-top:1px dashed var(--line);margin:14px 0}
.iblk{border-top:1px solid var(--line);padding-top:4px}.iblk textarea{resize:vertical;font:inherit}
.empty{border:1px dashed var(--line);border-radius:10px;padding:18px;text-align:center;color:var(--ink-3);font-size:13px}
.photo{border-radius:8px;background:repeating-linear-gradient(135deg,var(--stripe) 0 6px,var(--surface-2) 6px 12px);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink-3);font-size:11px}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:11.5px;color:var(--ink-3);font-weight:500;letter-spacing:.02em;background:var(--surface-2)}
td.n,th.n{text-align:right}
.tel{border:0;background:none;padding:0;color:var(--accent-ink);font-family:var(--mono);font-size:13px;text-decoration:underline dotted;text-underline-offset:3px}

/* 대시보드 */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi small{color:var(--ink-3);font-size:12px}
.kpi b{display:block;font-family:var(--mono);font-size:24px;font-weight:500;letter-spacing:-.02em;margin-top:2px}
.kpi.alert b{color:var(--bad)}
.dgrid{display:grid;grid-template-columns:1.3fr 1fr;gap:14px}
.bars{display:grid;gap:12px}
.bar{display:grid;grid-template-columns:62px 1fr 92px;gap:10px;align-items:center;font-size:13px}
.bar .tr{height:10px;border-radius:5px;background:var(--surface-2);border:1px solid var(--line);position:relative;overflow:hidden}
.bar .fl{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:5px}
.bar .v{text-align:right;font-family:var(--mono);font-size:12.5px;color:var(--ink-2)}
.bar .v em{font-style:normal;color:var(--bad)}
.rows{display:grid}
.rowi{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line);font-size:13.5px;background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.rowi:last-child{border-bottom:0}
.rowi:hover{background:var(--surface-2)}
.rowi .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 대시보드 가로 넘침 방지 — 긴 사업장명·방문내용이 화면 폭을 밀어내지 않게 (2026-11-05) */
.page{grid-template-columns:minmax(0,1fr)}
.page>*,.dgrid>*,.kpis>*{min-width:0}
.kpis{grid-template-columns:repeat(5,minmax(0,1fr))}
.dgrid{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}
.rows,.rowi{min-width:0}
.rowi>*:not(.grow){flex:none}

/* 사업장 */
.sites{display:grid;grid-template-columns:330px 1fr;height:100%}
.list{border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-height:0}
.lhead{padding:14px 14px 10px;display:grid;gap:8px;border-bottom:1px solid var(--line)}
.lhead .top{display:flex;align-items:center;justify-content:space-between}
.lhead h2{font-size:16px}
.search{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--surface-2)}
.search input{border:0;background:none;outline:none;flex:1;min-width:0}
.search svg{width:15px;height:15px;color:var(--ink-3)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters select{border:1px solid var(--line);border-radius:7px;padding:3px 6px;font-size:12px;background:var(--surface)}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 9px;font-size:12px;color:var(--ink-2)}
.fchip[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent}
.lcount{font-size:11.5px;color:var(--ink-3);padding:6px 14px;border-bottom:1px solid var(--line)}
.lbody{overflow:auto;flex:1}
.si{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 14px;border-bottom:1px solid var(--line);background:none;border-left:3px solid transparent;border-top:0;border-right:0;width:100%;text-align:left}
.si:hover{background:var(--surface-2)}
.si[aria-current="true"]{background:var(--accent-soft);border-left-color:var(--accent)}
.si .nm{font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px}
.si .nm .star{color:var(--accent);font-size:12px}
.si .sub{font-size:12px;color:var(--ink-3)}
.si .nm,.si .sub{grid-column:1}
.si .hc{grid-column:2;grid-row:1/3;align-self:center;display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-size:12.5px}
.si .hc small{font-size:11px;padding:0 6px}
.detail{overflow:auto;min-width:0;display:flex;flex-direction:column}
.dh{background:var(--surface);border-bottom:1px solid var(--line);padding:16px 22px 0;position:sticky;top:0;z-index:2}
.dh .back{display:none;border:0;background:none;padding:0 0 8px;color:var(--accent-ink);font-size:13px}
.dh .t{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dh h2{font-size:20px;font-weight:700;letter-spacing:-.01em}
.dh .sum{display:flex;gap:18px;margin-top:8px;font-size:12.5px;color:var(--ink-3);flex-wrap:wrap}
.dh .sum b{font-family:var(--mono);color:var(--ink);font-weight:500;font-size:14px;margin-left:4px}
.tabs{display:flex;gap:2px;margin-top:12px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:9px 12px;font-weight:500;color:var(--ink-3);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.dbody{padding:18px 22px 90px;display:grid;gap:14px;align-content:start}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.person{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;grid-template-columns:56px 1fr;gap:4px 12px;background:var(--surface)}
.person .photo{width:56px;height:56px;grid-row:1/5}
.person .pn{font-weight:600;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.person .pr{font-size:12.5px;color:var(--ink-2)}
.person[data-drag]{cursor:grab;-webkit-touch-callout:none}
.person[data-drag] img{-webkit-user-drag:none}
.person.dragging{cursor:grabbing;border-style:dashed;border-color:var(--accent);box-shadow:0 6px 18px rgba(0,0,0,.16);opacity:.85}
body.reordering{cursor:grabbing;user-select:none;-webkit-user-select:none}
body.reordering .person:not(.dragging){transition:none}
.draghint{font-weight:400;font-size:12px}
.tl{display:grid;gap:0}
.tli{display:grid;grid-template-columns:86px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.tli:last-child{border-bottom:0}
.tli .d{font-family:var(--mono);font-size:12px;color:var(--ink-3);padding-top:2px}
.tli .c{display:grid;gap:4px;font-size:13.5px}
.tli .c .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--ink-3)}
.thumbs{display:flex;gap:6px}.thumbs .photo{width:54px;height:40px}
.equip{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.eq{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.eq .eh{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.eq .eh b{font-size:14px}
.eq .eb{padding:12px 14px;display:grid;gap:10px}.eq .eb:empty{display:none}
.eqcover{display:block;position:relative;width:100%;aspect-ratio:4/3;max-height:260px;border:0;padding:0;margin:0;background:var(--surface-2);overflow:hidden;cursor:pointer}.eqcover img{width:100%;height:100%;object-fit:cover;display:block}.eqcover .num{position:absolute;right:8px;bottom:8px;font-size:11px;background:rgba(0,0,0,.55);color:#fff;padding:2px 6px;border-radius:6px}.eqcover.add{display:grid;place-items:center;color:var(--ink-3);font-size:13px;border-bottom:1px dashed var(--line);aspect-ratio:auto;height:90px}
.eq .ph2{display:flex;gap:6px}.eq .ph2 .photo{width:64px;height:48px}
.readonly{background:var(--warn-soft);color:var(--warn);font-size:12.5px;padding:8px 12px;border-radius:8px;display:flex;gap:8px;align-items:center}
.fab{position:sticky;bottom:18px;align-self:flex-end;margin:-70px 18px 18px 0;z-index:5;box-shadow:var(--shadow);border-radius:999px;padding:10px 16px}
.zone{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}

/* 설정 */
.stabs{display:flex;gap:6px;flex-wrap:wrap}
.stabs button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:13px;color:var(--ink-2)}
.stabs button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 12px;max-height:320px;overflow:auto;padding:4px}
.checks label{display:flex;gap:6px;align-items:center;font-size:13px}
.codes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.codes .list2{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.addrow{display:flex;gap:6px}.addrow input{flex:1;min-width:0;border:1px solid var(--line);border-radius:7px;padding:4px 8px;background:var(--surface)}

/* 로그인 */
.login{height:100%;display:grid;place-items:center;padding:20px;background:var(--paper)}
.lcard{width:min(360px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px;display:grid;gap:14px;box-shadow:var(--shadow)}
.lcard h1{font-size:19px}
.field{display:grid;gap:4px}.field span{font-size:12px;color:var(--ink-3)}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);width:100%}
.otp{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.otp input{text-align:center;font-family:var(--mono);font-size:18px;padding:8px 0;border:1px solid var(--line);border-radius:8px;background:var(--surface);width:100%}
.lnote{font-size:12px;color:var(--ink-3);display:grid;gap:3px}
.vbox{border:1px dashed var(--line);border-radius:10px;padding:10px;margin-bottom:12px;display:grid;gap:8px;background:var(--surface-2,transparent)}
.vbox .vhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.vbox .vhead b{font-size:13px}
.vbox .vst{font-size:12px;color:var(--ink-3);margin-left:auto}
.vbox textarea{width:100%;min-height:72px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);font-size:13px}
.vbox .rec{background:var(--bad);border-color:var(--bad);color:#fff}
.vbox .rec .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#fff;margin-right:6px;animation:vblink 1s infinite}
@keyframes vblink{50%{opacity:.2}}
/* 도착 브리핑 */
.brief{max-width:620px;margin:0 auto;padding:16px 18px 60px}
.brief .bh{padding:4px 0 12px;border-bottom:2px solid var(--accent)}
.brief .bh .when{font-size:12.5px;color:var(--ink-3);margin:0 0 4px}
.brief .bh h1{font-size:24px;line-height:1.2;margin:0 0 6px}
.brief .bh .sub{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--ink-2)}
.brief .quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.brief .quick .btn{display:flex;flex-direction:column;align-items:center;padding:9px 4px;font-size:13px;line-height:1.25;text-decoration:none}
.brief .quick .btn small{font-weight:400;color:var(--ink-3);font-size:11px;margin-top:2px}
.brief section{margin-top:20px}
.brief section h2{font-size:15px;margin:0 0 8px;display:flex;align-items:baseline;gap:8px}
.brief section h2 .n{font-size:12.5px;color:var(--ink-3);font-weight:500}
.brief section h2 .upd{margin-left:auto;font-size:12px;color:var(--ink-3);font-weight:400}
.brief .bx{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.brief .row{display:flex;gap:10px;padding:10px 14px;border-top:1px solid var(--line);align-items:flex-start}
.brief .row:first-child{border-top:0}
.brief .row .l{flex:1;min-width:0}
.brief .row .nm{font-weight:600}
.brief .row .mt{font-size:13px;color:var(--ink-2)}
.brief .row .dt{flex:none;width:52px;font-size:12.5px;color:var(--ink-3);font-family:var(--mono);padding-top:2px}
.brief .row .pct{flex:none;font-weight:700;font-size:17px;font-family:var(--mono)}
.brief .kv{display:grid;grid-template-columns:repeat(4,1fr);text-align:center}
.brief .kv div{padding:10px 4px;border-left:1px solid var(--line)}
.brief .kv div:first-child{border-left:0}
.brief .kv b{display:block;font-size:20px;font-family:var(--mono);font-weight:600}
.brief .kv span{font-size:11.5px;color:var(--ink-3)}

async function afterSignIn(){
  S.me=null;stopIdle(); // 인증이 끝나기 전에는 어떤 경로로도 본 화면이 뜨지 않게
  app.innerHTML='<div class="loading">불러오는 중…</div>';
  try{
    var me=await q(sb.rpc('site_me'));
    if(!me){await sb.auth.signOut();showLogin('이 앱을 쓸 수 있는 계정이 아닙니다. 관리자에게 문의하세요.');return;}
    me.sites=me.sites||[];
    if(me.must_change_pw){showChangePw(true);return;}
    if(me.role==='admin'){
      var al=await sb.auth.mfa.getAuthenticatorAssuranceLevel();
      if(!al.data||al.data.currentLevel!=='aal2'){var lf=await sb.auth.mfa.listFactors();var tot=((lf.data&&lf.data.totp)||[]).filter(function(f){return f.status==='verified';});
        if(tot.length)showOtpVerify(tot[0]);else showOtpEnroll();return;}
    }
    var rec=null;try{rec=sessionStorage.getItem('chm-sites-rec');}catch(x){}
    if(!rec){sb.rpc('site_record_login').then(function(){});try{sessionStorage.setItem('chm-sites-rec','1');}catch(x){}}
    S.me=me; // 비밀번호 변경·OTP까지 모두 통과한 뒤에만 로그인 상태로 인정
    await loadAll();startIdle();render();if(!(await briefFromHash()))geoAuto();
  }catch(e){showLogin(errMsg(e));}
}

function showOtpVerify(f){
  authCard('<form class="lcard" id="fOtp" novalidate>'+brandHead('2단계 인증','인증 앱에 표시된 6자리 숫자를 입력하세요')+otpInputs()+
   '<div class="err" id="oerr"></div><button class="btn pri" id="obtn" style="justify-content:center">확인</button>'+
   '<div class="lnote"><span>폰을 바꾸거나 잃어버렸으면 다른 관리자에게 OTP 초기화를 요청하세요.</span></div><button type="button" class="linkbtn" id="oout">로그아웃</button></form>');
  bindOtp(f.id);

function otpInputs(){var h='<div class="otp">';for(var i=0;i<6;i++)h+='<input id="o'+i+'" inputmode="numeric" autocomplete="one-time-code" maxlength="1" aria-label="'+(i+1)+'번째 숫자">';return h+'</div>';}
function bindOtp(factorId){
  var f=document.getElementById('fOtp');document.getElementById('oout').onclick=logout;
  var ins=f.querySelectorAll('.otp input');ins[0].focus();
  f.addEventListener('input',function(e){var t=e.target;if(!t.matches('.otp input'))return;var v=t.value.replace(/[^0-9]/g,'');
    if(v.length>1){for(var i=0;i<6;i++)ins[i].value=v[i]||'';ins[Math.min(5,v.length-1)].focus();return;}
    t.value=v;if(v&&t.nextElementSibling)t.nextElementSibling.focus();});
  f.addEventListener('keydown',function(e){if(e.key==='Backspace'&&e.target.matches('.otp input')&&!e.target.value&&e.target.previousElementSibling)e.target.previousElementSibling.focus();});
  f.addEventListener('submit',async function(e){e.preventDefault();
    var code='';ins.forEach(function(x){code+=x.value;});var er=document.getElementById('oerr'),bt=document.getElementById('obtn');
    if(!/^[0-9]{6}$/.test(code)){er.textContent='6자리 숫자를 모두 입력하세요.';return;}
    bt.disabled=true;var r=await sb.auth.mfa.challengeAndVerify({factorId:factorId,code:code});
    if(r.error){er.textContent='숫자가 맞지 않습니다. 앱에 새로 뜬 숫자로 다시 입력하세요.';bt.disabled=false;ins.forEach(function(x){x.value='';});ins[0].focus();return;}
    afterSignIn();});
}

  var f=activeSites()[0];S.siteId=f?f.id:null;S.detailFor=null;S.detail=null;S.open=false;S.imp=null;S.histNames=null;S.zone='전체';S.client='전체';S.cimp=null;S.creports=null;render();var mn=document.getElementById('main');if(mn)mn.scrollTop=0;}
function latestRows(siteId){var rows=S.staff.filter(function(r){return r.site_id===siteId;});if(!rows.length)return[];
  var mx=rows.reduce(function(m,r){return r.base_date>m?r.base_date:m;},'');return rows.filter(function(r){return r.base_date===mx;});}
function staffOf(siteId,zone){var t=CATS.map(function(){return[0,0];});latestRows(siteId).forEach(function(r){if(zone&&zone!=='전체'&&r.zone!==zone)return;var k=CATS.indexOf(r.job);if(k>=0){t[k][0]=Math.round((t[k][0]+Number(r.quota))*10)/10;t[k][1]=Math.round((t[k][1]+Number(r.current))*10)/10;}});return t;}
function totOf(siteId){return staffOf(siteId).reduce(function(p,v){return[p[0]+v[0],p[1]+v[1]];},[0,0]);}
function baseDateOf(siteId){var l=latestRows(siteId);return l.length?l[0].base_date:null;}
function zonesOf(siteId){var z=[];latestRows(siteId).forEach(function(r){if(z.indexOf(r.zone)<0)z.push(r.zone);});return z;}

async function refreshSite(siteId){

    q(sb.from('site_staffing').select('id,site_id,zone,job,quota,current,base_date').eq('site_id',siteId)),

    q(sb.from('site_visits').select('*').order('visit_date',{ascending:false}).order('id',{ascending:false}).limit(500))]);

var VISIT_SRC={safety:{label:'안전보건점검',url:'https://chmsafety.github.io/safety-inspection/'},edu:{label:'교육관리',url:'https://chmsafety.github.io/chmedu/'},note:{label:'현장활동보고서',url:'https://chmsafety.github.io/note/'}};
function visitSrcChip(v){if(!v.source_app)return '';var m=VISIT_SRC[v.source_app]||{label:v.source_app,url:''};return '<span class="chip src" title="'+esc(m.label)+' 앱에서 자동으로 연동된 기록">'+(m.url?'<a href="'+esc(m.url)+'" target="_blank" rel="noopener">':'')+'연동 · '+esc(m.label)+(m.url?'</a>':'')+'</span>';}
function visitWho(v){var h='';if(v.visitor)h+='<span>방문자 <b>'+esc(v.visitor)+'</b></span>';else if(v.source_app)h+='<span>방문자 본인</span>';if(v.attendee)h+='<span>미팅자 '+esc(v.attendee)+'</span>';if(!v.source_app)h+='<span>· 작성 '+esc(memberName(v.created_by))+'</span>';return h;}
function visitRow(v){var s=byId(S.sites,v.site_id);return '<button type="button" class="rowi" data-go="'+v.site_id+'" data-gotab="basic"><span class="num muted" style="font-size:12px">'+esc(v.visit_date.slice(5))+'</span><span class="chip acc">'+esc(purposeText(v))+'</span><span class="grow"><b>'+esc(s?s.name:'')+'</b> <span class="muted">· '+esc(v.content)+'</span></span></button>';}

/* ---------- 사업장 목록 ---------- */
function filtered(){var t=S.q.trim();
  return activeSites().filter(function(s){
    if(t&&s.name.indexOf(t)<0&&clientName(s.client_id).indexOf(t)<0)return false;
    if(S.client!=='전체'&&String(s.client_id)!==S.client)return false;
    if(S.short){var x=totOf(s.id);if(x[0]-x[1]<=0)return false;}
    if(S.mine&&S.me.sites.indexOf(s.id)<0)return false;return true;});}
function viewSites(){
  var list=filtered();
  var items=list.map(function(s){var t=totOf(s.id),g=t[0]-t[1],mine=!isAdmin()&&S.me.sites.indexOf(s.id)>=0,zn=zonesOf(s.id).filter(Boolean).length;
    return '<button type="button" class="si" data-site="'+s.id+'"'+(S.siteId===s.id?' aria-current="true"':'')+'><span class="nm">'+esc(s.name)+(mine?'<span class="star" title="담당">★</span>':'')+'</span><span class="hc"><span class="num">'+t[1]+'/'+t[0]+'</span>'+(g>0?'<small class="chip bad">−'+g+'</small>':'')+'</span><span class="sub">'+esc(clientName(s.client_id))+(zn>1?' · 구역 '+zn:'')+'</span></button>';}).join('');
  return '<div class="sites" data-open="'+(S.open?1:0)+'"><section class="list"><div class="lhead">'+coTabs()+'<div class="top"><h2>사업장</h2>'+geoBtn()+(isAdmin()?'<button type="button" class="btn sm" data-act="site-add">'+I.plus+'추가</button>':'')+'</div>'+
   '<label class="search">'+I.search+'<input id="q" type="search" autocomplete="nope" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="사업장·고객사 검색" value="'+esc(S.q)+'"></label>'+
   '<div class="filters"><select id="fc" aria-label="고객사"><option value="전체">고객사 전체</option>'+S.clients.filter(function(c){return activeSites().some(function(s){return s.client_id===c.id;});}).map(function(c){return '<option value="'+c.id+'"'+(S.client===String(c.id)?' selected':'')+'>'+esc(c.name)+'</option>';}).join('')+'</select>'+
   '<button type="button" class="fchip" id="fs" aria-pressed="'+S.short+'">결원</button>'+(!isAdmin()?'<button type="button" class="fchip" id="fm" aria-pressed="'+S.mine+'">★ 내 담당</button>':'')+'</div></div>'+
   '<div class="lcount">'+list.length+'곳 · 현원/정원</div><div class="lbody">'+(items||'<div class="empty" style="margin:14px">조건에 맞는 사업장이 없습니다.</div>')+'</div></section>'+
   '<section class="detail" id="detail">'+viewDetail()+'</section></div>';
}
async function openDetail(siteId,rerender){
  S.siteId=siteId;
  try{await loadDetail(siteId);}catch(e){toast(errMsg(e));return;}
  if(S.view!=='sites'||S.siteId!==siteId)return;
  var d=document.getElementById('detail');if(d){var sc=d.scrollTop;d.innerHTML=viewDetail();if(!rerender)d.scrollTop=0;else d.scrollTop=sc;}
}
function viewDetail(){
  var s=byId(S.sites,S.siteId);if(!s)return '<div class="empty" style="margin:24px">사업장을 고르세요.</div>';
  var t=totOf(s.id),g=t[0]-t[1],ed=canEdit(s.id);
  var ready=S.detailFor===s.id&&S.detail;
  var tabs=[['client','고객사'],['basic','기본현황'],['staff','인력현황'],['equip','설비현황'],['const','공사현황'],['hist','기타 이력']];
  var body=!ready?'<div class="loading" style="height:120px">불러오는 중…</div>':S.tab==='client'?tabClient(s,ed):S.tab==='basic'?tabBasic(s,ed):S.tab==='staff'?tabStaff(s,ed):S.tab==='equip'?tabEquip(s,ed):S.tab==='const'?tabConst(s):tabHist(s);
  var vcount=ready?S.detail.visits.length:S.visits.filter(function(v){return v.site_id===s.id;}).length;
  return '<header class="dh"><button type="button" class="back" data-act="back">‹ 사업장 목록</button><div class="t"><h2>'+esc(s.name)+'</h2><button type="button" class="btn sm" data-act="brief-open" data-id="'+s.id+'" title="한 장짜리 현황">📋 브리핑</button><span class="chip co-chip co-'+esc((s.company||'CHM').toLowerCase())+'">'+esc(s.company||'CHM')+'</span><span class="chip acc">'+esc(clientName(s.client_id))+'</span>'+(!ed?'<span class="chip warn">'+I.lock+' 조회 전용</span>':'')+'</div>'+
   '<div class="sum"><span>현원/정원<b>'+t[1]+'/'+t[0]+'</b></span><span>결원<b style="color:'+(g>0?'var(--bad)':'inherit')+'">'+g+'</b></span><span>관리자<b>'+S.managers.filter(function(m){return m.site_id===s.id&&m.active;}).length+'</b></span><span>방문기록<b>'+vcount+'</b></span></div>'+
   '<div class="tabs" role="tablist">'+tabs.map(function(x){return '<button type="button" role="tab" data-tab="'+x[0]+'" aria-selected="'+(S.tab===x[0])+'">'+x[1]+'</button>';}).join('')+'</div></header>'+
   '<div class="dbody">'+(!ed?'<div class="readonly">'+I.lock+'담당 사업장이 아니어서 볼 수만 있습니다. 수정이 필요하면 관리자에게 담당 지정을 요청하세요.</div>':'')+body+'</div>'+
   (ed&&ready?'<button type="button" class="btn pri fab" data-act="visit-add">'+I.plus+'방문기록</button>':'');
}
function notesOf(type,id){return S.detail.notes.filter(function(n){return n.target_type===type&&n.target_id===id;});}
function notesHtml(list,ed){if(!list.length)return '<div class="muted" style="font-size:12.5px">메모 없음</div>';
  return '<div class="tl">'+list.map(function(n){return '<div class="tli"><span class="d">'+esc(n.note_date)+'</span><div class="c"><span style="white-space:pre-wrap">'+esc(n.body)+'</span>'+photoStrip('note',n.id,ed)+'<div class="meta"><span>작성 '+esc(memberName(n.created_by))+'</span>'+(ed?'<button type="button" class="linkbtn" data-act="note-edit" data-id="'+n.id+'">수정</button>':'')+'</div></div></div>';}).join('')+'</div>';}
function telBtn(kind,id,phone,who){if(!phone)return '<span class="muted">—</span>';return '<button type="button" class="tel" data-tel="'+kind+':'+id+'" data-full="'+esc(telFmt(phone))+'">'+esc(mask(phone))+'</button>';}

function tabClient(s,ed){
  var cs=S.detail.contacts.filter(function(c){return c.active;}).map(function(c){
    return '<article class="card"><h3>'+esc(c.name)+' <span class="muted" style="font-weight:400">'+esc([c.dept,c.title].filter(Boolean).join(' · '))+'</span>'+(ed?'<span class="r actions"><button type="button" class="btn sm" data-act="note-add" data-type="contact" data-id="'+c.id+'">메모</button><button type="button" class="btn sm" data-act="contact-edit" data-id="'+c.id+'">수정</button></span>':'')+'</h3>'+
    '<dl class="kv" style="margin-bottom:12px"><dt>연락처</dt><dd>'+telBtn('contact',c.id,c.phone)+'</dd><dt>이메일</dt><dd>'+(c.email?esc(c.email):'<span class="muted">—</span>')+'</dd><dt>부서</dt><dd>'+(c.dept?esc(c.dept):'<span class="muted">—</span>')+'</dd></dl>'+
    '<div style="font-size:12px;color:var(--ink-3);margin-bottom:4px">명함 사진</div>'+photoStrip('contact_card',c.id,ed,'명함 사진이 없습니다')+
    '<div style="font-size:12px;color:var(--ink-3);margin:12px 0 4px">미팅 기록 · 메모</div>'+notesHtml(notesOf('contact',c.id),ed)+'</article>';}).join('');
  return '<section class="card"><h3>고객사'+(isAdmin()?'<button type="button" class="btn sm r" data-act="client-set">고객사 변경·추가</button>':'')+'</h3><dl class="kv"><dt>고객사명</dt><dd><b>'+esc(clientName(s.client_id))+'</b></dd><dt>담당자</dt><dd>'+S.detail.contacts.filter(function(c){return c.active;}).length+'명</dd></dl></section>'+
   '<div class="ph"><h3 style="font-size:14px">담당자 정보</h3>'+(ed?'<button type="button" class="btn sm" data-act="contact-add">'+I.plus+'담당자 추가</button>':'')+'</div>'+
   (cs||'<div class="empty">등록된 고객사 담당자가 없습니다.</div>');
}
function tabBasic(s,ed){
  var vs=S.detail.visits;var fl=[s.floors_above?'지상 '+s.floors_above+'층':'',s.floors_below?'지하 '+s.floors_below+'층':''].filter(Boolean).join(' / ');
  return '<section class="card"><h3>기본현황'+(ed?'<button type="button" class="btn sm r" data-act="basic-edit">수정</button>':'')+'</h3><dl class="kv"><dt>주소</dt><dd>'+(s.addr?esc(s.addr):'<span class="muted">미입력</span>')+'</dd><dt>연면적</dt><dd>'+(s.area_m2?'<span class="num">'+fmt(s.area_m2)+'</span> ㎡':'<span class="muted">미입력</span>')+'</dd><dt>층수</dt><dd>'+(fl?esc(fl):'<span class="muted">미입력</span>')+'</dd>'+
   '<dt>건축물대장</dt><dd>'+(s.building_id?'<span class="chip good">빌딩정보시스템 연결</span>'+(s.building_synced_at?' <span class="muted" style="font-size:12px">'+esc(dt(s.building_synced_at).slice(0,10))+' 조회</span>':''):'<span class="muted">'+(s.addr?'아직 불러오지 않음':'주소를 넣으면 자동으로 불러옵니다')+'</span>')+
   (ed&&s.addr?' <button type="button" class="btn sm" data-act="bld-sync">'+(s.building_id?'다시 불러오기':'불러오기')+'</button>':'')+'</dd>'+(s.memo?'<dt>메모</dt><dd style="white-space:pre-wrap">'+esc(s.memo)+'</dd>':'')+'</dl><div style="font-size:12px;color:var(--ink-3);margin:12px 0 4px">현장 사진</div>'+photoStrip('site',s.id,ed,'현장 사진이 없습니다')+'</section>'+infoCard(s,'bldg_info',ed)+floorsCard(s,ed)+
   '<section class="card"><h3>방문기록 <span class="chip">'+vs.length+'건</span>'+(ed?'<button type="button" class="btn sm r" data-act="visit-add">'+I.plus+'방문기록</button>':'')+'</h3>'+
   (vs.length?'<div class="tl">'+vs.map(function(v){return '<div class="tli"><span class="d">'+esc(v.visit_date)+'</span><div class="c"><div class="meta"><span class="chip acc">'+esc(purposeText(v))+'</span>'+visitSrcChip(v)+visitWho(v)+(ed?'<button type="button" class="linkbtn" data-act="visit-edit" data-id="'+v.id+'">수정</button>':'')+'</div><span style="white-space:pre-wrap">'+esc(v.content)+'</span>'+photoStrip('visit',v.id,ed)+'</div></div>';}).join('')+'</div>':'<div class="empty">방문기록이 없습니다.</div>')+'</section>';
}
function tabStaff(s,ed){
  var zones=zonesOf(s.id);var multi=zones.length>1||(zones.length===1&&zones[0]!=='');
  if(!multi||(S.zone!=='전체'&&zones.indexOf(S.zone)<0))S.zone='전체';
  var a=staffOf(s.id,S.zone),tt=[0,0];
  var rows=CATS.map(function(c,k){tt[0]+=a[k][0];tt[1]+=a[k][1];if(!a[k][0]&&!a[k][1])return '';var g=a[k][1]-a[k][0];return '<tr><td>'+c+'</td><td class="n num">'+a[k][0]+'</td><td class="n num">'+a[k][1]+'</td><td class="n num" style="color:'+(g<0?'var(--bad)':'var(--ink-3)')+'">'+(g>0?'+'+g:g)+'</td></tr>';}).join('');
  var bd=baseDateOf(s.id);
  var ms=S.managers.filter(function(m){return m.site_id===s.id;}).sort(function(x,y){return (y.active-x.active)||(x.sort-y.sort)||(x.id-y.id);}).map(function(m){var ns=notesOf('manager',m.id);var role=m.role==='직접입력'&&m.role_etc?m.role_etc:m.role;
    return '<article class="person"'+(ed&&m.active?' data-drag="manager" data-id="'+m.id+'"':'')+(m.active?'':' style="opacity:.6"')+'>'+faceSlot(m,ed)+'<span class="pn"><span class="chip acc">'+esc(role)+'</span>'+esc(m.name)+(m.active?'':' <span class="chip">퇴직·전보</span>')+'</span><span class="pr">'+telBtn('manager',m.id,m.phone)+'</span><span class="pr">'+(m.photo_consent_on?'<span class="chip good">사진 동의 '+esc(m.photo_consent_on)+'</span>':'<span class="chip warn">사진 동의 전</span>')+'</span>'+
     (ns.length?'<span class="pr" style="grid-column:1/-1;margin-top:6px;border-top:1px solid var(--line);padding-top:6px">'+esc(ns[0].note_date)+' · '+esc(ns[0].body)+(ns.length>1?' <span class="muted">외 '+(ns.length-1)+'건</span>':'')+'</span>':'')+
     (ed?'<span class="pa"><button type="button" class="btn sm" data-act="note-add" data-type="manager" data-id="'+m.id+'">메모</button><button type="button" class="btn sm" data-act="manager-edit" data-id="'+m.id+'">수정</button>'+(ns.length?'<button type="button" class="btn sm" data-act="notes-view" data-type="manager" data-id="'+m.id+'">메모 전체</button>':'')+'</span>':(ns.length?'<span class="pa"><button type="button" class="btn sm" data-act="notes-view" data-type="manager" data-id="'+m.id+'">메모 전체</button></span>':''))+'</article>';}).join('');
  return '<section class="card"><h3>직군별 인원 <span class="muted" style="font-weight:400;font-size:12px">'+(bd?'기준일 '+esc(bd):'자료 없음')+'</span>'+(ed?'<button type="button" class="btn sm r" data-act="staff-edit">인원 수정</button>':'')+'</h3>'+
   (multi?'<div class="zone">'+['전체'].concat(zones).map(function(z){return '<button type="button" class="fchip" data-zone="'+esc(z)+'" aria-pressed="'+(S.zone===z)+'">'+esc(z||'구역 없음')+'</button>';}).join('')+'</div>':'')+
   '<div class="tbl-wrap"><table><thead><tr><th>직군</th><th class="n">정원</th><th class="n">현원</th><th class="n">과부족</th></tr></thead><tbody>'+(rows||'<tr><td colspan="4" class="muted">인원 자료가 없습니다.</td></tr>')+'<tr><td><b>계</b></td><td class="n num"><b>'+tt[0]+'</b></td><td class="n num"><b>'+tt[1]+'</b></td><td class="n num" style="color:'+(tt[1]<tt[0]?'var(--bad)':'var(--ink-3)')+'"><b>'+(tt[1]-tt[0])+'</b></td></tr></tbody></table></div></section>'+
   '<div class="ph"><h3 style="font-size:14px">관리자'+(ed&&ms?' <span class="muted draghint">카드를 끌어 순서 변경</span>':'')+'</h3>'+(ed?'<button type="button" class="btn sm" data-act="manager-add">'+I.plus+'관리자 추가</button>':'')+'</div>'+
   (ms?'<div class="people">'+ms+'</div>':'<div class="empty">등록된 관리자가 없습니다.</div>')+peopleSection(s,ed);
}
function peopleSection(s,ed){
  var list=(S.detail.people||[]).slice().sort(function(x,y){return (y.active-x.active)||(x.sort-y.sort)||(x.id-y.id);});
  var cards=list.map(function(p){var ns=notesOf('person',p.id),last=ns[0];
    return '<article class="person"'+(ed&&p.active?' data-drag="person" data-id="'+p.id+'"':'')+(p.active?'':' style="opacity:.6"')+'>'+faceSlot(p,ed,'person_face')+'<span class="pn">'+(p.job?'<span class="chip">'+esc(p.job)+'</span>':'')+esc(p.name)+(p.title?' <span class="muted" style="font-weight:400">'+esc(p.title)+'</span>':'')+(p.active?'':' <span class="chip">퇴직·전보</span>')+'</span>'+
     '<span class="pr">'+telBtn('person',p.id,p.phone)+'</span><span class="pr">'+(ns.length?'<span class="chip acc">만남·대화 '+ns.length+'건</span> <span class="muted">최근 '+esc(last.note_date)+'</span>':'<span class="chip">이력 없음</span>')+'</span>'+
     (p.memo?'<span class="pr" style="grid-column:1/-1;white-space:pre-wrap">'+esc(p.memo)+'</span>':'')+
     (last?'<span class="pr" style="grid-column:1/-1;margin-top:6px;border-top:1px solid var(--line);padding-top:6px;white-space:pre-wrap">'+esc(last.body)+'</span>':'')+
     '<span class="pa">'+(ed?'<button type="button" class="btn sm" data-act="note-add" data-type="person" data-id="'+p.id+'">'+I.plus+'이력</button><button type="button" class="btn sm" data-act="person-edit" data-id="'+p.id+'">수정</button>':'')+(ns.length?'<button type="button" class="btn sm" data-act="notes-view" data-type="person" data-id="'+p.id+'">이력 전체</button>':'')+'</span></article>';}).join('');
  return '<div class="ph" style="margin-top:18px"><h3 style="font-size:14px">직원 <span class="muted" style="font-weight:400;font-size:12px">만나거나 이야기 나눈 직원 · '+list.filter(function(p){return p.active;}).length+'명'+(ed&&cards?' · 카드를 끌어 순서 변경':'')+'</span></h3>'+(ed?'<button type="button" class="btn sm" data-act="person-add">'+I.plus+'직원 추가</button>':'')+'</div>'+
   (cards?'<div class="people">'+cards+'</div>':'<div class="empty">등록된 직원이 없습니다.'+(ed?' 현장에서 만난 직원을 추가하고 나눈 이야기를 이력으로 남기세요.':'')+'</div>');
}
function tabEquip(s,ed){
  var html=ed?'<div class="actions" style="justify-content:flex-end"><button type="button" class="btn sm" data-act="go-eqp">📷 여러 사업장 설비사진 한꺼번에 올리기</button></div>':'',kinds=codes('equipment_kind');
  S.detail.equip.forEach(function(e){if(!kinds.some(function(k){return k.label===e.kind;}))kinds.push({label:e.kind});});
  html+=infoCard(s,'facility_info',ed);
  kinds.forEach(function(k){var list=S.detail.equip.filter(function(e){return e.kind===k.label;}).sort(function(a,b){return a.id-b.id;});
    html+='<div class="ph"><h3 style="font-size:14px">'+esc(k.label)+' <span class="chip">'+list.reduce(function(a,e){return a+(e.qty||0);},0)+'대</span></h3>'+(ed?'<div class="actions" style="margin:0"><label class="btn sm" title="사진 1장마다 '+esc(k.label)+' 1대 — 사진 없는 제원카드가 있으면 거기에 먼저 붙고, 없으면 새 카드가 만들어집니다">📷 사진으로 추가<input type="file" accept="image/*" multiple hidden data-ptype="equip_kind" data-pkind="'+esc(k.label)+'" data-pid="0"></label><button type="button" class="btn sm" data-act="equip-add" data-kind="'+esc(k.label)+'">'+I.plus+'직접 추가</button></div>':'')+'</div>'+(kindPhotos(k.label).length?kindStrip(k.label,false):'');
    html+=list.length?'<div class="equip">'+list.map(function(e,i){var ex=EQ_EXTRA[e.kind];var exv=e.extra&&ex?e.extra[ex]:'';

function voiceIntro(){

   '<textarea id="vtxt" placeholder="예) 오늘 판교 N타워 방문. 냉동기 2호기 소음 점검, 베어링 교체 필요해서 업체 견적 요청하기로 함. 총무팀 김과장과 미팅…"></textarea>'+
   '<div class="lnote"><span>말한 내용이 글로 쌓이면 「양식으로 정리」를 누르세요. 방문일·목적·미팅자·내용이 아래 칸에 채워지며, 확인·수정한 뒤 저장하면 됩니다.</span></div></div>';
}
function voiceBind(m,siteList,purposes){

  var SR=window.SpeechRecognition||window.webkitSpeechRecognition,r=null,on=false,fin='',interim='';

    fin=ta.value?ta.value.trim()+' ':'';interim='';
    r.onresult=function(e){interim='';for(var i=e.resultIndex;i<e.results.length;i++){var t=e.results[i][0].transcript;if(e.results[i].isFinal)fin+=t.trim()+' ';else interim+=t;}show();};
    r.onerror=function(e){if(e.error==='not-allowed'){st.textContent='마이크 권한을 허용해 주세요';stop();}else if(e.error!=='no-speech'&&e.error!=='aborted'){st.textContent='오류: '+e.error;}};
    r.onend=function(){if(on){try{r.start();}catch(x){}}};
    try{r.start();on=true;rec.className='btn sm rec';rec.innerHTML='<span class="dot"></span>듣는 중 · 누르면 멈춤';st.textContent='';}
    catch(x){st.textContent='마이크를 열지 못했습니다';}
  }
  function stop(){on=false;if(r){try{r.stop();}catch(x){}}rec.className='btn sm';rec.textContent='이어서 말하기';interim='';show();}
  if(rec)rec.addEventListener('click',function(){on?stop():start();});

/* ---------- 층별현황 (직접 입력 / 사진으로 자동 입력 → 확인 후 저장) ---------- */
function floorKey(f){var t=String(f||'').toUpperCase().replace(/\s/g,'');var m;
  if(/^(PH|옥탑|RF|R)/.test(t))return 1000+(parseInt(t.replace(/\D/g,''),10)||0);
  if((m=t.match(/^(B|지하)(\d+)/)))return -Number(m[2]);
  if((m=t.match(/^(\d+)(F|층)?/)))return Number(m[1]);
  if((m=t.match(/^(M|중)(\d*)/)))return (Number(m[2])||1)+0.5;
  return 500;}

    var ns=[s.name.replace(/\s*\(CHMS\)\s*$/,'')].concat(String((s.aliases||{}).const||'').split(','));
    ns.forEach(function(n){n=String(n).replace(/\s+/g,'');if(n.length<2)return;

    while((m=o.re.exec(t))){var a=m.index,b=a+m[0].length,clash=false;

/* 워드(.docx) 읽기 — 엑셀 읽기와 같은 압축 해제 도구 사용 */
async function readDocx(file){
  if(!/\.docx$/i.test(file.name))throw new Error('docx 형식의 워드 파일을 골라 주세요 (doc는 워드에서 docx로 다시 저장)');

  var blips=function(n){return xtags(n,'blip').map(function(b){return b.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','embed')||b.getAttribute('r:embed');}).filter(Boolean);};
  var grid=function(tbl){return kids(tbl,'tr').map(function(tr){var row=[],col=0;
    var gb=xtags(tr,'gridBefore')[0];if(gb)col+=Number(gb.getAttribute('w:val')||gb.getAttributeNS('*','val'))||0;
    kids(tr,'tc').forEach(function(tc){var pr=kids(tc,'tcPr')[0],span=1,vc=false;
      if(pr){var gs=kids(pr,'gridSpan')[0];if(gs)span=Number(gs.getAttribute('w:val'))||1;var vm=kids(pr,'vMerge')[0];if(vm){var v=vm.getAttribute('w:val');vc=!v||v==='continue';}}
      row[col]={text:kids(tc,'p').map(ptext).join('\n'),imgs:blips(tc),vc:vc};col+=span;});return row;});};
  var body=xtags(doc,'body')[0],paras=[],tables=[];
  [].forEach.call(body.childNodes,function(n){if(n.localName==='p')paras.push(ptext(n));else if(n.localName==='tbl')tables.push(grid(n));});
  var out={paras:paras,items:[],photos:[],prevLabel:'',thisLabel:''};
  // 주간공사 표
  tables.forEach(function(rows){
    var hr=-1;for(var i=0;i<rows.length&&i<6;i++){if(rows[i].some(function(c){return c&&/공사\s*명/.test(c.text);})){hr=i;break;}}
    if(hr<0)return;
    var nh=1;if(rows[hr+1]&&rows[hr+1].some(function(c){return c&&/전주|금주/.test(c.text);}))nh=2;
    var w=rows.reduce(function(m,r){return Math.max(m,r.length);},0),lab=[];
    for(var c=0;c<w;c++){var s='';for(var h=hr;h<hr+nh;h++){var x=rows[h][c];if(x&&!x.vc)s+=' '+x.text;}lab[c]=s.replace(/\s+/g,'');}
    var col=function(re){for(var c=0;c<lab.length;c++)if(re.test(lab[c]))return c;return -1;};
    var C={cat:col(/^구분/),name:col(/공사명/),period:col(/계약|기간/),contractor:col(/시공/),prog:col(/공정/),prev:col(/전주/),cur:col(/금주/),remark:col(/특기|요청|비고/)};
    if(C.prev>=0){var m1=/\(([^)]*)\)/.exec(lab[C.prev]);if(m1)out.prevLabel=m1[1].replace(/~/,' ~ ');}
    if(C.cur>=0){var m2=/\(([^)]*)\)/.exec(lab[C.cur]);if(m2)out.thisLabel=m2[1].replace(/~/,' ~ ');}
    if(C.prev<0&&C.cur<0){var cc=col(/공사내용/);if(cc>=0)C.cur=cc;}

  });

  var photoRefs=[];

    var cap=cstOne(c.text);if(!cap){var nx=rows[ri+1]&&rows[ri+1][ci];if(nx&&!nx.imgs.length)cap=cstOne(nx.text);}

/* ---------- 설비사진 한꺼번에 올리기 (2026-11-10 · 10단계) ----------
   - 여러 사업장에서 찍은 설비 사진을 한 번에 고르면, 사진 속 촬영 위치(GPS)로 사업장을 찾아 나눠 담는다 (도착 알림과 같은 250m 기준)
   - 위치정보가 없는 사진: 「지금 촬영」이면 현재 위치, 아니면 촬영일에 본인이 남긴 방문기록이 한 곳일 때 그 사업장을 추천, 그래도 없으면 직접 고름
   - 설비 종류(냉동기·보일러…)는 올리기 전에 한 번 고르고, 확인 화면에서 사진별로 바꿀 수 있다
   - 저장: site_photos (target_type 'equip_kind', kind=설비 종류) · 사진은 1600px로 줄여 site-photos/<사업장>/equip_kind/ 에 저장
   - 관리자는 전체, 일반계정은 담당 사업장만 반영 */
var EQP_MAX=60;
async function exifRead(file){
  var out={};
  try{
    var v=new DataView(await file.slice(0,262144).arrayBuffer());if(v.getUint16(0)!==0xFFD8)return out;
    var o=2,base=-1;
    while(o+4<=v.byteLength){var mk=v.getUint16(o);if((mk&0xFF00)!==0xFF00||mk===0xFFDA)break;var len=v.getUint16(o+2);
      if(mk===0xFFE1&&v.getUint32(o+4)===0x45786966){base=o+10;break;}o+=2+len;}
    if(base<0)return out;
    var le=v.getUint16(base)===0x4949,u16=function(p){return v.getUint16(p,le);},u32=function(p){return v.getUint32(p,le);};
    var ifd=function(off){var m={},p=base+off,n=u16(p);for(var i=0;i<n;i++){var e=p+2+i*12;m[u16(e)]={type:u16(e+2),count:u32(e+4),pos:e+8};}return m;};
    var str=function(t){if(!t)return '';var p=t.count>4?base+u32(t.pos):t.pos,s='';for(var i=0;i<t.count;i++){var c=v.getUint8(p+i);if(!c)break;s+=String.fromCharCode(c);}return s;};
    var dms=function(t){if(!t||t.count<3)return null;var p=base+u32(t.pos),r=[];for(var i=0;i<3;i++){var d=u32(p+i*8+4);r.push(d?u32(p+i*8)/d:0);}return r[0]+r[1]/60+r[2]/3600;};
    var i0=ifd(u32(base+4)),when='';
    if(i0[0x8769]){var ex=ifd(u32(i0[0x8769].pos));when=str(ex[0x9003])||str(ex[0x9004]);}
    if(!when)when=str(i0[0x0132]);
    var m=/^(\d{4}):(\d{2}):(\d{2})/.exec(when);if(m&&m[1]>'2000')out.date=m[1]+'-'+m[2]+'-'+m[3];
    if(i0[0x8825]){var g=ifd(u32(i0[0x8825].pos)),la=dms(g[2]),lo=dms(g[4]);
      if(la!=null&&lo!=null&&(Math.abs(la)>0.01||Math.abs(lo)>0.01)&&Math.abs(la)<=90&&Math.abs(lo)<=180){
        out.lat=str(g[1]).charAt(0)==='S'?-la:la;out.lng=str(g[3]).charAt(0)==='W'?-lo:lo;}}
  }catch(e){}
  return out;

/* ---------- 위치 자동 인식 (2026-11-03) ----------
   사업장에 도착하면(GPS 기준 GEO_RADIUS m 안) 그 사업장의 현황 화면을 자동으로 연다.
   좌표는 빌딩정보시스템(buildings) 것을 쓰므로, 주소를 넣고 건축물대장을 불러온 사업장만 인식된다. 위치는 저장하지 않는다. */
function geoOn(){try{return localStorage.getItem('chm-sites-geo')!=='off';}catch(e){return true;}}
function geoBtn(){return navigator.geolocation?'<button type="button" class="btn sm" data-act="geo" title="현재 위치에서 가장 가까운 사업장 열기">📍 내 위치</button>':'';}
function geoDist(a,b,c,d){var R=6371000,x=(c-a)*Math.PI/180,y=(d-b)*Math.PI/180,h=Math.sin(x/2)*Math.sin(x/2)+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(y/2)*Math.sin(y/2);return 2*R*Math.asin(Math.sqrt(h));}
function geoNear(lat,lng){var best=null;
  S.sites.forEach(function(x){if(x.status!=='운영'||!x.building_id)return;var b=S.bld[x.building_id];if(!b)return;var d=geoDist(lat,lng,b.lat,b.lng);if(!best||d<best.d)best={s:x,d:d};});
  return best;}
function geoAuto(){if(!S.me||!geoOn()||!navigator.geolocation)return;if(document.getElementById('modal'))return;if(S.view==='eqp')return; // 입력 중이면 방해하지 않음
  if(Date.now()-S.geo.at<90e3)return;try{if(sessionStorage.getItem('chm-sites-geo-denied'))return;}catch(e){}geoCheck(false);}
function geoCheck(manual,btn){
  if(!navigator.geolocation){if(manual)toast('이 기기에서는 위치를 쓸 수 없습니다');return;}
  S.geo.at=Date.now();if(btn){btn.disabled=true;btn.textContent='📍 찾는 중…';}
  var done=function(){if(btn){btn.disabled=false;btn.textContent='📍 내 위치';}};
  navigator.geolocation.getCurrentPosition(function(pos){done();
    var c=pos.coords,n=geoNear(c.latitude,c.longitude);
    if(!n){if(manual)toast('좌표가 등록된 사업장이 없습니다');return;}
    var lim=Math.max(GEO_RADIUS,Math.min(c.accuracy||0,600)); // 위치 오차가 크면 그만큼만 넓게 봄
    if(n.d>lim){if(manual)toast('가까운 사업장이 없습니다 · 가장 가까운 곳: '+n.s.name+' ('+(n.d<1000?Math.round(n.d)+'m':(n.d/1000).toFixed(1)+'km')+')',5000);return;}
    if(!manual&&S.geo.site===n.s.id)return; // 같은 사업장에 머무는 동안은 한 번만
    S.geo.site=n.s.id;geoOpen(n.s,n.d,c.accuracy);
  },function(err){done();
    if(err.code===1){try{sessionStorage.setItem('chm-sites-geo-denied','1');}catch(e){}if(manual)toast('위치 권한이 꺼져 있습니다. 브라우저·앱 설정에서 이 사이트의 위치 사용을 허용해 주세요',6000);}
    else if(manual)toast('현재 위치를 확인하지 못했습니다'+(err.code===3?' (시간 초과)':'')+'. 잠시 후 다시 시도하세요');
  },{enableHighAccuracy:true,timeout:12000,maximumAge:30000});
}
function geoOpen(site,d){
  var co=site.company||'CHM';if(S.company!==co){S.company=co;try{localStorage.setItem('chm-sites-company',co);}catch(e){}}
  closeModal();S.view='sites';S.siteId=site.id;S.tab='basic';S.open=true;S.zone='전체';S.q='';S.client='전체';S.short=false;S.mine=false;render();
  var m=document.getElementById('main');if(m)m.scrollTop=0;
  toast('📍 현재 위치 '+site.name+' ('+Math.round(d)+'m) — 사업장현황을 열었습니다',5000);
  arriveNotify(site,d,acc);
}

}

  h+='<section><h2>인원현황 <span class="n">정원 '+fmt(t[0])+' · 현원 '+fmt(t[1])+(gap>0?' · <span class="old">결원 '+fmt(gap)+'</span>':'')+'</span>'+(bd?'<span class="upd">'+esc(bd)+' 기준</span>':'')+'</h2><div class="bx"><div class="kv">'+(cells||'<div><b>—</b><span>인원 자료 없음</span></div>')+'</div>'+
    (mg.length?'<div class="pl">'+mg.map(function(m){return '<div><b>'+esc(m.role==='직접입력'?m.role_etc||'':m.role)+'</b> '+esc(m.name)+(m.phone?' <span class="muted">'+esc(m.phone)+'</span>':'')+'</div>';}).join('')+'</div>':'')+'</div></section>';
  // 최근 방문
  var vs=D.visits.slice(0,3),lastV=D.visits[0],days=lastV?Math.round((new Date(today())-new Date(lastV.visit_date))/864e5):null;
  h+='<section><h2>최근 방문 <span class="n">전체 '+D.visits.length+'건</span>'+(lastV?'<span class="upd">마지막 '+esc(lastV.visit_date)+'</span>':'')+'</h2><div class="bx">'+(vs.length?vs.map(function(v){
    return '<div class="row"><div class="dt">'+esc(String(v.visit_date).slice(5).replace('-','.'))+'</div><div class="l"><div class="mt">'+esc([v.purpose==='기타'?v.purpose_etc||v.purpose:v.purpose,v.visitor,v.attendee].filter(Boolean).join(' · '))+'</div><div style="font-size:13.5px;margin-top:2px;white-space:pre-wrap">'+esc(String(v.content||'').slice(0,160))+(String(v.content||'').length>160?'…':'')+'</div></div></div>';}).join(''):'<div class="empty">방문기록이 없습니다</div>')+'</div>'+
    (days!=null&&days>=30?'<div class="nt"><span>⏳</span><span>지난 방문 후 <b>'+days+'일</b> 지났습니다.</span></div>':'')+'</section>';
  // 공사현황
  var ch='';
  if(!cst||cst.loading)ch='<div class="loading" style="height:60px">불러오는 중…</div>';
  else if(cst.error)ch='<div class="empty">'+esc(cst.error)+'</div>';
  else{var g={},order=[];cst.items.forEach(function(it){if(!g[it.pkey]){g[it.pkey]=[];order.push(it.pkey);}g[it.pkey].push(it);});
    order.forEach(function(k){g[k].sort(function(a,b){return a.r.report_date<b.r.report_date?1:-1;});});
    var ing=order.map(function(k){return g[k][0];}).filter(function(it){return !CST_DONE(it);});
    var lastR=cst.items.reduce(function(m,it){return it.r.report_date>m?it.r.report_date:m;},'');
    ch=(ing.length?ing.map(function(it){var p=it.progress==null?null:Math.max(0,Math.min(100,Number(it.progress)));
      return '<div class="row"><div class="l"><div class="nm">'+esc(it.name)+(it.r.report_date<lastR?' <span class="old">('+esc(it.r.report_date)+' 보고)</span>':'')+'</div><div class="mt">'+esc([it.contractor,it.period].filter(Boolean).join(' · '))+'</div><div class="cb"><i style="width:'+(p||0)+'%"></i></div>'+(it.this_work?'<div class="mt" style="margin-top:4px">금주: '+esc(it.this_work)+'</div>':'')+(it.remark?'<div class="mt">특기: '+esc(it.remark)+'</div>':'')+'</div><div class="pct">'+(p==null?'—':p+'%')+'</div></div>';}).join(''):'<div class="empty">진행 중인 공사가 없습니다</div>');
    ch='<div class="bx">'+ch+'</div>'+(cst.photos.length?'<div class="more"><button type="button" class="btn sm" data-act="brief-detail" data-id="'+s.id+'" data-tab="const">공사 사진 '+cst.photos.length+'장 보기</button></div>':'');}
  h+='<section><h2>공사현황'+(cst&&cst.items?' <span class="n">진행 '+(function(){var seen={},n=0;cst.items.slice().sort(function(a,b){return a.r.report_date<b.r.report_date?1:-1;}).forEach(function(it){if(seen[it.pkey])return;seen[it.pkey]=1;if(!CST_DONE(it))n++;});return n;})()+'건</span>':'')+(cst&&cst.items&&cst.items.length?'<span class="upd">주간보고 '+esc(cst.items.reduce(function(m,it){return it.r.report_date>m?it.r.report_date:m;},''))+'</span>':'')+'</h2>'+ch+'</section>';
  // 설비현황 요약
  var yr=new Date().getFullYear(),kinds={},ko=[];D.equip.forEach(function(e){if(!kinds[e.kind]){kinds[e.kind]={q:0,old:null,n:0};ko.push(e.kind);}var k=kinds[e.kind];k.q+=e.qty||0;k.n++;if(e.install_year&&(!k.old||e.install_year<k.old))k.old=e.install_year;});
  h+='<section><h2>설비현황 요약 <span class="n">'+D.equip.reduce(function(a,e){return a+(e.qty||0);},0)+'대</span></h2><div class="bx">'+(ko.length?ko.map(function(k){var x=kinds[k],age=x.old?yr-x.old:null;
    return '<div class="row"><div class="l"><div class="nm">'+esc(k)+' <span class="muted" style="font-weight:400">'+x.q+'대</span></div><div class="mt">'+esc(D.equip.filter(function(e){return e.kind===k;}).map(function(e){return [e.type,e.maker,e.capacity].filter(Boolean).join(' ');}).filter(Boolean).slice(0,3).join(' / '))+'</div></div>'+(age!=null?'<div class="pct" style="font-size:13px;font-weight:500;'+(age>=15?'color:var(--bad)':'color:var(--ink-3)')+'">'+x.old+'년'+(age>=15?' 노후':'')+'</div>':'')+'</div>';}).join(''):'<div class="empty">등록된 설비가 없습니다</div>')+'</div></section>';
  // 최근 특이사항
  var ns=D.notes.slice(0,5),NT={site:'사업장',contact:'고객사',equipment:'설비',people:'직원',manager:'관리자',staffing:'인원'};
  h+='<section><h2>최근 특이사항 <span class="n">메모 '+D.notes.length+'건</span></h2><div class="bx">'+(ns.length?ns.map(function(n){return '<div class="row"><div class="dt">'+esc(String(n.note_date||'').slice(5).replace('-','.'))+'</div><div class="l"><div class="mt">'+esc(NT[n.target_type]||n.target_type||'')+'</div><div style="font-size:13.5px;white-space:pre-wrap">'+esc(String(n.body||'').slice(0,200))+'</div></div></div>';}).join(''):'<div class="empty">특이사항 메모가 없습니다</div>')+'</div></section>';
  return '<div class="brief">'+back+head+h+'<p class="muted" style="font-size:12px;margin-top:24px">사업장 관리 앱 · 문자 링크는 받은 뒤 24시간 동안 본인 계정으로만 열립니다.</p></div>';
}

/* ---------- 도착 알림 설정 (내 계정) ---------- */
async function arriveForm(){
  var pf=null;try{var u=await sb.auth.getUser();var uid=u.data&&u.data.user&&u.data.user.id;pf=await q(sb.from('site_arrive_prefs').select('*').eq('user_id',uid).maybeSingle());}catch(e){toast(errMsg(e));return;}
  pf=pf||{};
  var m=openForm({title:'📍 도착 알림 설정',fields:[
    {id:'x',type:'info',html:'<span>사업장 250m 안에서 앱을 열거나 돌아오면 현황 화면을 자동으로 열고, 아래 설정대로 현황 링크 문자를 보냅니다. 폰이 닫혀 있을 때는 감지되지 않습니다.</span>'},
    {id:'geo',type:'check',label:'사업장에 도착하면 현황 화면 자동 열기',value:geoOn()},
    {id:'phone',label:'내 휴대폰 번호',value:pf.phone||'',inputmode:'tel',placeholder:'010-0000-0000'},
    {id:'sms_on',type:'check',label:'도착하면 현황 링크 문자 받기',value:pf.sms_on!==false},
    [{id:'gap',type:'select',label:'같은 사업장 재발송',value:pf.gap||'day',options:[{value:'day',label:'하루 1회'},{value:'visit',label:'방문마다 (2시간)'},{value:'week',label:'일주일 1회'}]},
     {id:'hours',type:'select',label:'보내는 시간대',value:pf.hours||'08-19',options:[{value:'08-19',label:'08:00~19:00'},{value:'always',label:'항상'}]}],
    {id:'draft',type:'check',label:'도착하면 방문기록 작성 창 바로 열기',value:!!pf.draft},
    {id:'y',type:'info',html:'<div class="actions"><button type="button" class="btn sm" id="arr-test">시험 문자 보내기</button><span class="muted" id="arr-msg"></span></div>'}],
    onSave:async function(v){
      try{localStorage.setItem('chm-sites-geo',v.geo?'on':'off');}catch(e){}
      var ph=String(v.phone||'').replace(/\D/g,'');if(ph&&!/^01\d{8,9}$/.test(ph))throw new Error('휴대폰 번호를 확인하세요 (예: 010-1234-5678)');
      var u=await sb.auth.getUser();var uid=u.data.user.id;
      await q(sb.from('site_arrive_prefs').upsert({user_id:uid,phone:ph?ph.replace(/^(\d{3})(\d{3,4})(\d{4})$/,'$1-$2-$3'):null,sms_on:!!v.sms_on,gap:v.gap,hours:v.hours,draft:!!v.draft,updated_at:new Date().toISOString()},{onConflict:'user_id'}));
      toast(v.sms_on&&!ph?'저장했습니다 — 휴대폰 번호가 없어 문자는 가지 않습니다':'도착 알림 설정을 저장했습니다');if(v.geo)geoCheck(false);}});
  var tb=m.querySelector('#arr-test'),tm=m.querySelector('#arr-msg');
  tb.addEventListener('click',async function(){tb.disabled=true;tm.textContent='보내는 중…';
    try{var ph=String(document.getElementById('f_phone').value||'').replace(/\D/g,'');if(!/^01\d{8,9}$/.test(ph))throw new Error('휴대폰 번호를 먼저 적고 저장하세요');
      var u=await sb.auth.getUser();await q(sb.from('site_arrive_prefs').upsert({user_id:u.data.user.id,phone:ph.replace(/^(\d{3})(\d{3,4})(\d{4})$/,'$1-$2-$3'),updated_at:new Date().toISOString()},{onConflict:'user_id'}));
      var r=await sb.functions.invoke('site-arrive',{body:{action:'test'}});
      if(r.error){var msg=r.error.message;try{var j=await r.error.context.json();if(j&&j.error)msg=j.error;}catch(e){}throw new Error(msg);}
      tm.textContent='보냈습니다 ('+(r.data&&r.data.phone)+')';}
    catch(x){tm.textContent=errMsg(x);}tb.disabled=false;});
}
/* ---------- 설정 › 도착 알림 (관리자) ---------- */
function setArrive(){
  if(!S.arr){S.arr={loading:true};sb.functions.invoke('site-arrive',{body:{action:'status'}}).then(function(r){S.arr=r.error?{error:r.error.message}:(r.data||{});if(S.view==='set'&&S.stab==='arrive'){S.keepScroll=true;render();}});}
  var a=S.arr;if(a.loading)return '<div class="loading" style="height:120px">불러오는 중…</div>';
  if(a.error)return '<div class="empty">'+esc(a.error)+'</div>';
  var nm=function(uid){var m=S.members.filter(function(x){return x.user_id===uid;})[0];return m?m.name:'?';};
  var rows=(a.logs||[]).map(function(l){var st=byId(S.sites,l.site_id);
    return '<tr><td class="num muted">'+dt(l.at)+'</td><td>'+esc(nm(l.user_id))+'</td><td>'+esc(st?st.name:'#'+l.site_id)+'</td><td class="n num">'+(l.dist!=null?l.dist+'m':'')+'</td><td>'+(l.sms?'<span class="chip good">발송</span>':'<span class="chip">—</span>')+'</td><td class="num">'+esc(l.phone||'')+'</td><td style="white-space:normal">'+esc(l.note||'')+'</td><td class="num muted">'+(l.opened_at?dt(l.opened_at):'')+'</td></tr>';}).join('');
  return '<section class="card"><h3>도착 알림 <span class="chip">이달 문자 '+(a.month||0)+'건</span><span class="muted" style="font-weight:400;font-size:12px">'+(a.ready?'발신번호 '+esc(a.sender)+(a.balance!=null?' · 솔라피 잔액 '+fmt(a.balance)+'원':'')+(a.err?' · '+esc(a.err):''):'문자 발송 설정(솔라피) 없음')+'</span><button type="button" class="btn sm r" data-act="arr-reload">새로고침</button></h3>'+
    '<p class="muted" style="font-size:12.5px">사업장 250m 안에서 앱을 열면 기록됩니다. 문자는 각자 내 계정 › 도착 알림 설정에서 켜고 끕니다. 링크는 24시간 동안 받은 본인만 열 수 있습니다.</p>'+
    '<div class="tbl-wrap"><table><thead><tr><th>시각</th><th>이름</th><th>사업장</th><th class="n">거리</th><th>문자</th><th>번호</th><th>비고</th><th>링크 열람</th></tr></thead><tbody>'+(rows||'<tr><td colspan="8" class="muted">아직 도착 기록이 없습니다</td></tr>')+'</tbody></table></div></section>';
}
async function onReturn(){if(!S.me)return;if(!(await ensureAal()))return;geoAuto();
  if(S.view==='dash'&&Date.now()-(S.lastLoad||0)>300e3){S.lastLoad=Date.now();loadAll().then(function(){if(S.me){S.keepScroll=true;render();}}).catch(function(){});}}
window.addEventListener('focus',onReturn);
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')onReturn();});
window.addEventListener('pageshow',function(e){if(e.persisted&&S.me)ensureAal();});

/* ---------- 시작 ---------- */
try{localStorage.removeItem('chm-sites-lock');}catch(e){}
(async function(){
  app.innerHTML='<div class="loading">불러오는 중…</div>';
  try{var r=await sb.auth.getSession();if(r.data&&r.data.session)afterSignIn();else showLogin();}catch(e){showLogin(errMsg(e));}
})();
})();

</script>
