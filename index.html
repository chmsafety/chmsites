<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://dbymktwxokbvfshlztrg.supabase.co; connect-src https://dbymktwxokbvfshlztrg.supabase.co wss://dbymktwxokbvfshlztrg.supabase.co; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0E6B5B">
<title>CHM 사업장 관리</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="chmsites-192.png">
<link rel="apple-touch-icon" href="chmsites-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CHM Sites">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>

:root{
  --paper:#EBF0EE;--surface:#FFFFFF;--surface-2:#F4F7F6;--ink:#14201D;--ink-2:#4A5955;--ink-3:#7A8884;
  --line:#D5DDDA;--accent:#0E6B5B;--accent-soft:#DCEFE9;--accent-ink:#0A5245;
  --warn:#A65A06;--warn-soft:#FBEBD6;--bad:#B42318;--bad-soft:#FBE4E1;--good:#157A3A;--good-soft:#DDF2E4;
  --stripe:#E3E9E7;--shadow:0 10px 30px rgba(20,32,29,.08);
  --sans:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --paper:#0D1412;--surface:#141D1B;--surface-2:#1A2523;--ink:#E3EBE8;--ink-2:#A8B6B2;--ink-3:#73827E;
  --line:#283532;--accent:#3FBFA3;--accent-soft:#15322B;--accent-ink:#86DCC8;
  --warn:#EFA24C;--warn-soft:#3A2913;--bad:#F07D6F;--bad-soft:#3B1D19;--good:#58D68A;--good-soft:#143322;
  --stripe:#1F2A28;--shadow:0 10px 30px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{color-scheme:dark;
  --paper:#0D1412;--surface:#141D1B;--surface-2:#1A2523;--ink:#E3EBE8;--ink-2:#A8B6B2;--ink-3:#73827E;
  --line:#283532;--accent:#3FBFA3;--accent-soft:#15322B;--accent-ink:#86DCC8;
  --warn:#EFA24C;--warn-soft:#3A2913;--bad:#F07D6F;--bad-soft:#3B1D19;--good:#58D68A;--good-soft:#143322;
  --stripe:#1F2A28;--shadow:0 10px 30px rgba(0,0,0,.35)}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;padding:12px 16px 24px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}

/* 앱 틀 */
.app{container-type:inline-size;background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden;
  height:min(860px,calc(100dvh - 90px));min-height:620px;max-width:1280px;margin-inline:auto;box-shadow:var(--shadow);position:relative}
.app.phone{max-width:390px;height:800px;border-radius:28px;border-width:6px;border-color:var(--ink)}
.shell{display:grid;grid-template-columns:196px 1fr;height:100%}
.nav{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 10px;gap:2px;min-width:0}
.brand{display:flex;align-items:center;gap:9px;padding:2px 8px 16px}
.brand .mk{width:34px;height:34px;flex:none;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:10.5px;letter-spacing:.02em}
.brand b{font-size:14px;line-height:1.2}.brand small{display:block;font-size:11px;color:var(--ink-3)}
.nav button.it{display:flex;align-items:center;gap:10px;border:0;background:none;padding:9px 10px;border-radius:8px;color:var(--ink-2);font-weight:500;text-align:left;width:100%}
.nav button.it:hover{background:var(--surface-2)}
.nav button.it[aria-current="page"]{background:var(--accent-soft);color:var(--accent-ink)}
.nav svg{width:18px;height:18px;flex:none}
.who{margin-top:auto;border-top:1px solid var(--line);padding:12px 8px 0;font-size:12px;color:var(--ink-3);display:grid;gap:6px}
.who b{color:var(--ink);font-size:13px}
.who button{justify-self:start;border:1px solid var(--line);background:none;border-radius:6px;padding:3px 8px;font-size:12px;color:var(--ink-2)}
.main{overflow:auto;min-width:0;position:relative}
.main.fill{overflow:hidden}
.page{padding:22px 24px 40px;display:grid;gap:18px;align-content:start}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ph h1{font-size:21px;font-weight:700;letter-spacing:-.01em}
.ph p{margin:2px 0 0;color:var(--ink-3);font-size:12.5px}

/* 공통 */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.card h3{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;margin-bottom:12px}
.card h3 .r{margin-left:auto}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:500;padding:1px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);white-space:nowrap}
.chip.acc{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.chip.ex{background:none;border-style:dashed;color:var(--ink-3)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.btn:hover{border-color:var(--ink-3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sm{padding:3px 9px;font-size:12px}
.btn svg{width:15px;height:15px}
.muted{color:var(--ink-3)}
.kv{margin:0;display:grid;grid-template-columns:88px 1fr;gap:6px 12px;font-size:13.5px}
.kv dt{color:var(--ink-3)}.kv dd{margin:0}
.empty{border:1px dashed var(--line);border-radius:10px;padding:18px;text-align:center;color:var(--ink-3);font-size:13px}
.photo{border-radius:8px;background:repeating-linear-gradient(135deg,var(--stripe) 0 6px,var(--surface-2) 6px 12px);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink-3);font-size:11px}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:11.5px;color:var(--ink-3);font-weight:500;letter-spacing:.02em;background:var(--surface-2)}
td.n,th.n{text-align:right}
.tel{border:0;background:none;padding:0;color:var(--accent-ink);font-family:var(--mono);font-size:13px;text-decoration:underline dotted;text-underline-offset:3px}

/* 대시보드 */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi small{color:var(--ink-3);font-size:12px}
.kpi b{display:block;font-family:var(--mono);font-size:24px;font-weight:500;letter-spacing:-.02em;margin-top:2px}
.kpi.alert b{color:var(--bad)}
.dgrid{display:grid;grid-template-columns:1.3fr 1fr;gap:14px}
.bars{display:grid;gap:12px}
.bar{display:grid;grid-template-columns:62px 1fr 92px;gap:10px;align-items:center;font-size:13px}
.bar .tr{height:10px;border-radius:5px;background:var(--surface-2);border:1px solid var(--line);position:relative;overflow:hidden}
.bar .fl{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:5px}
.bar .v{text-align:right;font-family:var(--mono);font-size:12.5px;color:var(--ink-2)}
.bar .v em{font-style:normal;color:var(--bad)}
.rows{display:grid}
.rowi{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line);font-size:13.5px;background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.rowi:last-child{border-bottom:0}
.rowi:hover{background:var(--surface-2)}
.rowi .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 사업장 */
.sites{display:grid;grid-template-columns:330px 1fr;height:100%}
.list{border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-height:0}
.lhead{padding:14px 14px 10px;display:grid;gap:8px;border-bottom:1px solid var(--line)}
.lhead .top{display:flex;align-items:center;justify-content:space-between}
.lhead h2{font-size:16px}
.search{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--surface-2)}
.search input{border:0;background:none;outline:none;flex:1;min-width:0}
.search svg{width:15px;height:15px;color:var(--ink-3)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters select{border:1px solid var(--line);border-radius:7px;padding:3px 6px;font-size:12px;background:var(--surface)}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 9px;font-size:12px;color:var(--ink-2)}
.fchip[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent}
.lcount{font-size:11.5px;color:var(--ink-3);padding:6px 14px;border-bottom:1px solid var(--line)}
.lbody{overflow:auto;flex:1}
.si{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 14px;border-bottom:1px solid var(--line);background:none;border-left:3px solid transparent;border-top:0;border-right:0;width:100%;text-align:left}
.si:hover{background:var(--surface-2)}
.si[aria-current="true"]{background:var(--accent-soft);border-left-color:var(--accent)}
.si .nm{font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px}
.si .nm .star{color:var(--accent);font-size:12px}
.si .sub{font-size:12px;color:var(--ink-3)}
.si .nm,.si .sub{grid-column:1}
.si .hc{grid-column:2;grid-row:1/3;align-self:center;display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-size:12.5px}
.si .hc small{font-size:11px;padding:0 6px}
.detail{overflow:auto;min-width:0;display:flex;flex-direction:column}
.dh{background:var(--surface);border-bottom:1px solid var(--line);padding:16px 22px 0;position:sticky;top:0;z-index:2}
.dh .back{display:none;border:0;background:none;padding:0 0 8px;color:var(--accent-ink);font-size:13px}
.dh .t{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dh h2{font-size:20px;font-weight:700;letter-spacing:-.01em}
.dh .sum{display:flex;gap:18px;margin-top:8px;font-size:12.5px;color:var(--ink-3);flex-wrap:wrap}
.dh .sum b{font-family:var(--mono);color:var(--ink);font-weight:500;font-size:14px;margin-left:4px}
.tabs{display:flex;gap:2px;margin-top:12px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:9px 12px;font-weight:500;color:var(--ink-3);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.dbody{padding:18px 22px 90px;display:grid;gap:14px;align-content:start}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.person{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;grid-template-columns:56px 1fr;gap:4px 12px;background:var(--surface)}
.person .photo{width:56px;height:56px;grid-row:1/5}
.person .pn{font-weight:600;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.person .pr{font-size:12.5px;color:var(--ink-2)}
.tl{display:grid;gap:0}
.tli{display:grid;grid-template-columns:86px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.tli:last-child{border-bottom:0}
.tli .d{font-family:var(--mono);font-size:12px;color:var(--ink-3);padding-top:2px}
.tli .c{display:grid;gap:4px;font-size:13.5px}
.tli .c .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--ink-3)}
.thumbs{display:flex;gap:6px}.thumbs .photo{width:54px;height:40px}
.equip{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.eq{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.eq .eh{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.eq .eh b{font-size:14px}
.eq .eb{padding:12px 14px;display:grid;gap:10px}
.eq .ph2{display:flex;gap:6px}.eq .ph2 .photo{width:64px;height:48px}
.readonly{background:var(--warn-soft);color:var(--warn);font-size:12.5px;padding:8px 12px;border-radius:8px;display:flex;gap:8px;align-items:center}
.fab{position:sticky;bottom:18px;align-self:flex-end;margin:-70px 18px 18px 0;z-index:5;box-shadow:var(--shadow);border-radius:999px;padding:10px 16px}
.zone{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}

/* 설정 */
.stabs{display:flex;gap:6px;flex-wrap:wrap}
.stabs button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:13px;color:var(--ink-2)}
.stabs button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 12px;max-height:320px;overflow:auto;padding:4px}
.checks label{display:flex;gap:6px;align-items:center;font-size:13px}
.codes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.codes .list2{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.addrow{display:flex;gap:6px}.addrow input{flex:1;min-width:0;border:1px solid var(--line);border-radius:7px;padding:4px 8px;background:var(--surface)}

/* 로그인 */
.login{height:100%;display:grid;place-items:center;padding:20px;background:var(--paper)}
.lcard{width:min(360px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px;display:grid;gap:14px;box-shadow:var(--shadow)}
.lcard h1{font-size:19px}
.field{display:grid;gap:4px}.field span{font-size:12px;color:var(--ink-3)}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);width:100%}
.otp{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.otp input{text-align:center;font-family:var(--mono);font-size:18px;padding:8px 0;border:1px solid var(--line);border-radius:8px;background:var(--surface);width:100%}
.lnote{font-size:12px;color:var(--ink-3);display:grid;gap:3px}

/* 모달·토스트 */
.modal{position:absolute;inset:0;background:rgba(10,20,18,.45);display:grid;place-items:center;z-index:20;padding:16px}
.mbox{background:var(--surface);border-radius:14px;width:min(480px,100%);max-height:100%;overflow:auto;padding:20px;display:grid;gap:12px;border:1px solid var(--line)}
.mbox h2{font-size:17px}
.mbox .act{display:flex;justify-content:flex-end;gap:8px}
.toast{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:999px;font-size:13px;z-index:30;box-shadow:var(--shadow);white-space:nowrap}

/* 폰 크기 (앱 폭 기준) */
@container (max-width:720px){
  .shell{grid-template-columns:1fr;grid-template-rows:1fr auto}
  .nav{flex-direction:row;border-right:0;border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));order:2;justify-content:space-around;gap:0}
  .brand,.who{display:none}
  .nav button.it{flex-direction:column;gap:2px;font-size:10.5px;padding:6px 4px;align-items:center;text-align:center}
  .page{padding:16px 16px 30px}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .kpis .kpi:first-child{grid-column:1/-1}
  .dgrid,.two{grid-template-columns:1fr}
  .sites{grid-template-columns:1fr}
  .sites[data-open="1"] .list{display:none}
  .sites:not([data-open="1"]) .detail{display:none}
  .list{border-right:0}
  .dh{padding:12px 16px 0}
  .dh .back{display:block}
  .dh h2{font-size:18px}
  .dbody{padding:14px 16px 90px}
  .person{grid-template-columns:48px 1fr}.person .photo{width:48px;height:48px}
  .tli{grid-template-columns:1fr;gap:2px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* 실제 앱 전용 */
html,body{height:100%}
body{padding:0;overflow:hidden}
.app{height:100%;max-width:none;border:0;border-radius:0;box-shadow:none;min-height:0}
.nav .it.sub{font-size:13px;padding:7px 10px}
.loading{display:grid;place-items:center;height:100%;color:var(--ink-3);font-size:13px}
.err{color:var(--bad);font-size:12.5px;min-height:1em}
.lcard .qr{display:grid;place-items:center;background:#fff;border-radius:10px;padding:10px;border:1px solid var(--line)}
.lcard .qr img{width:180px;height:180px}
.secret{font-family:var(--mono);font-size:12px;word-break:break-all;background:var(--surface-2);padding:6px 8px;border-radius:6px;border:1px solid var(--line)}
.steps{font-size:12.5px;color:var(--ink-2);margin:0;padding-left:18px;display:grid;gap:4px}
.mbox .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mbox .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.zonebox{border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:8px}
.zonebox table input{width:70px;border:1px solid var(--line);border-radius:6px;padding:4px 6px;text-align:right;font-family:var(--mono);background:var(--surface)}
.zonebox .zh{display:flex;gap:8px;align-items:center}
.zonebox .zh input{flex:1;border:1px solid var(--line);border-radius:6px;padding:4px 8px;background:var(--surface)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.danger.arm{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn[disabled]{opacity:.55;cursor:default}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.person .pa{grid-column:1/-1;display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.tli .ops{display:flex;gap:4px}
.linkbtn{border:0;background:none;color:var(--accent-ink);font-size:12px;padding:0;text-decoration:underline;text-underline-offset:3px}
.pwbox{font-family:var(--mono);font-size:16px;background:var(--accent-soft);color:var(--accent-ink);padding:10px 12px;border-radius:8px;text-align:center;letter-spacing:.04em;user-select:all}
.refresh{margin-left:auto}
@container (max-width:720px){.mbox .grid2,.mbox .grid3{grid-template-columns:1fr}}
.nav button.it.only-phone{display:none}
@container (max-width:720px){.nav button.it.only-phone{display:flex}}
.login{overflow:auto;place-items:safe center;height:100%}
.pstrip{display:flex;gap:6px;flex-wrap:wrap}
.pthumb{width:68px;height:52px;border-radius:8px;overflow:hidden;border:1px solid var(--line);padding:0;background:var(--surface-2);display:grid;place-items:center;flex:none}
.pthumb img{width:100%;height:100%;object-fit:cover;display:block}
.pthumb.add{border-style:dashed;color:var(--accent-ink);font-size:11.5px;cursor:pointer;background:none}
.pthumb.add:hover,.photo.face.add:hover{background:var(--accent-soft)}
.pthumb:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.photo.face{padding:0;overflow:hidden;cursor:pointer;background:var(--surface-2)}
.photo.face img{width:100%;height:100%;object-fit:cover;display:block}
.photo.face.add{border-style:dashed;color:var(--accent-ink);background:none;font-size:11px}

function randPw(){var a='abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789',p='';var r=new Uint32Array(12);crypto.getRandomValues(r);for(var i=0;i<12;i++)p+=a[r[i]%a.length];if(!/[0-9]/.test(p))p=p.slice(0,11)+'7';if(!/[A-Za-z]/.test(p))p='k'+p.slice(1);return p;}
function okPw(p){return p.length>=8&&/[A-Za-z]/.test(p)&&/[0-9]/.test(p);}

function errMsg(e){if(!e)return '알 수 없는 오류';var m=e.message||String(e);

  if(/JWT|expired/i.test(m))return '로그인이 만료되었습니다. 다시 로그인하세요.';
  return m;}

/* ---------- 인증 흐름 ---------- */
function authCard(inner){app.innerHTML='<div class="login">'+inner+'</div>';}
function brandHead(t,sub){return '<div style="display:flex;gap:10px;align-items:center"><span class="brand" style="padding:0"><span class="mk">CHM</span></span><div><h1>'+esc(t)+'</h1><span class="muted" style="font-size:12px">'+esc(sub)+'</span></div></div>';}

function showLogin(msg){
  authCard('<form class="lcard" id="fLogin" novalidate>'+brandHead('사업장 관리','CHM 내부 전용')+
   '<label class="field"><span>아이디</span><input id="lid" autocomplete="username" autocapitalize="off" spellcheck="false" required></label>'+
   '<label class="field"><span>비밀번호</span><input id="lpw" type="password" autocomplete="current-password" required></label>'+
   '<div class="err" id="lerr">'+esc(msg||'')+'</div><button class="btn pri" id="lbtn" style="justify-content:center">로그인</button>'+
   '<div class="lnote"><span>5회 틀리면 15분 동안 로그인할 수 없습니다 · 30분 쓰지 않으면 자동 로그아웃</span><span>비밀번호를 잊으면 관리자에게 재설정을 요청하세요.</span><span class="muted">'+VERSION+'</span></div></form>');
  var f=document.getElementById('fLogin');document.getElementById('lid').focus();
  f.addEventListener('submit',async function(e){e.preventDefault();
    var id=document.getElementById('lid').value.trim().toLowerCase(),pw=document.getElementById('lpw').value,er=document.getElementById('lerr'),bt=document.getElementById('lbtn');
    if(!id||!pw){er.textContent='아이디와 비밀번호를 입력하세요.';return;}
    bt.disabled=true;bt.textContent='확인 중…';er.textContent='';
    var res,j;
    try{res=await fetch(SB_URL+'/functions/v1/site-login',{method:'POST',headers:{'Content-Type':'application/json',apikey:SB_KEY},body:JSON.stringify({login_id:id,password:pw})});j=await res.json().catch(function(){return{};});}
    catch(x){er.textContent='서버에 연결하지 못했습니다. 인터넷 연결을 확인하세요.';bt.disabled=false;bt.textContent='로그인';return;}
    if(!res.ok||!j.access_token){er.textContent=j.error||'로그인하지 못했습니다.';bt.disabled=false;bt.textContent='로그인';return;}
    var ss=await sb.auth.setSession({access_token:j.access_token,refresh_token:j.refresh_token});
    if(ss.error){er.textContent=errMsg(ss.error);bt.disabled=false;bt.textContent='로그인';return;}
    try{sessionStorage.removeItem('chm-sites-rec');}catch(x){}
    afterSignIn();});
}

async function afterSignIn(){
  app.innerHTML='<div class="loading">불러오는 중…</div>';
  try{
    var me=await q(sb.rpc('site_me'));
    if(!me){await sb.auth.signOut();showLogin('이 앱을 쓸 수 있는 계정이 아닙니다. 관리자에게 문의하세요.');return;}
    me.sites=me.sites||[];S.me=me;
    if(me.must_change_pw){showChangePw(true);return;}
    if(me.role==='admin'){
      var al=await sb.auth.mfa.getAuthenticatorAssuranceLevel();
      if(!al.data||al.data.currentLevel!=='aal2'){var lf=await sb.auth.mfa.listFactors();var tot=((lf.data&&lf.data.totp)||[]).filter(function(f){return f.status==='verified';});
        if(tot.length)showOtpVerify(tot[0]);else showOtpEnroll();return;}
    }
    var rec=null;try{rec=sessionStorage.getItem('chm-sites-rec');}catch(x){}
    if(!rec){sb.rpc('site_record_login').then(function(){});try{sessionStorage.setItem('chm-sites-rec','1');}catch(x){}}
    await loadAll();startIdle();render();
  }catch(e){showLogin(errMsg(e));}
}

function showChangePw(first){
  authCard('<form class="lcard" id="fPw" novalidate>'+brandHead('비밀번호 변경',first?'처음 로그인하셨습니다. 새 비밀번호를 정하세요.':'새 비밀번호를 입력하세요.')+
   '<label class="field"><span>새 비밀번호</span><input id="np1" type="password" autocomplete="new-password"></label>'+
   '<label class="field"><span>새 비밀번호 확인</span><input id="np2" type="password" autocomplete="new-password"></label>'+
   '<div class="lnote"><span>8자 이상, 영문과 숫자를 섞어 주세요. 유출된 적 있는 비밀번호는 쓸 수 없습니다.</span></div>'+
   '<div class="err" id="perr"></div><button class="btn pri" id="pbtn" style="justify-content:center">변경</button>'+
   (first?'<button type="button" class="linkbtn" id="pout">로그아웃</button>':'<button type="button" class="linkbtn" id="pcancel">취소</button>')+'</form>');
  var out=document.getElementById('pout');if(out)out.onclick=logout;
  var cc=document.getElementById('pcancel');if(cc)cc.onclick=function(){render();};
  document.getElementById('np1').focus();
  document.getElementById('fPw').addEventListener('submit',async function(e){e.preventDefault();
    var a=document.getElementById('np1').value,b=document.getElementById('np2').value,er=document.getElementById('perr'),bt=document.getElementById('pbtn');
    if(!okPw(a)){er.textContent='8자 이상, 영문과 숫자를 섞어 주세요.';return;}
    if(a!==b){er.textContent='두 칸의 비밀번호가 다릅니다.';return;}
    bt.disabled=true;bt.textContent='변경 중…';
    var r=await sb.auth.updateUser({password:a});
    if(r.error){er.textContent=/pwned|leaked|compromised|weak/i.test(r.error.message)?'유출된 적 있는 비밀번호라 쓸 수 없습니다. 다른 비밀번호를 정하세요.':/same/i.test(r.error.message)?'기존과 다른 비밀번호를 정하세요.':errMsg(r.error);bt.disabled=false;bt.textContent='변경';return;}
    await sb.rpc('site_mark_pw_changed');toast('비밀번호를 바꿨습니다');
    if(first)afterSignIn();else render();});
}

async function showOtpEnroll(){
  authCard('<div class="lcard"><div class="loading" style="height:auto">OTP 등록 준비 중…</div></div>');
  try{
    var lf=await sb.auth.mfa.listFactors();var all=(lf.data&&lf.data.all)||[];
    for(var i=0;i<all.length;i++)if(all[i].status!=='verified')await sb.auth.mfa.unenroll({factorId:all[i].id});
    var en=await q(sb.auth.mfa.enroll({factorType:'totp',friendlyName:'CHM 사업장 관리'}));
    authCard('<form class="lcard" id="fOtp" novalidate>'+brandHead('OTP 등록','관리자 계정은 2단계 인증이 필수입니다')+
     '<ol class="steps"><li>폰에 Google Authenticator 또는 Microsoft Authenticator 앱을 설치합니다.</li><li>앱에서 + 를 눌러 아래 QR 코드를 찍습니다.</li><li>앱에 뜬 6자리 숫자를 입력합니다.</li></ol>'+
     '<div class="qr"><img alt="OTP 등록용 QR 코드" src="'+esc(en.totp.qr_code)+'"></div>'+
     '<div class="lnote"><span>QR을 찍을 수 없으면 이 키를 직접 입력하세요</span><span class="secret">'+esc(en.totp.secret)+'</span></div>'+
     otpInputs()+'<div class="err" id="oerr"></div><button class="btn pri" id="obtn" style="justify-content:center">등록 완료</button><button type="button" class="linkbtn" id="oout">로그아웃</button></form>');
    bindOtp(en.id);
  }catch(e){authCard('<div class="lcard"><div class="err">'+esc(errMsg(e))+'</div><button class="btn" id="oout">로그아웃</button></div>');document.getElementById('oout').onclick=logout;}
}
function showOtpVerify(f){
  authCard('<form class="lcard" id="fOtp" novalidate>'+brandHead('2단계 인증','인증 앱에 표시된 6자리 숫자를 입력하세요')+otpInputs()+
   '<div class="err" id="oerr"></div><button class="btn pri" id="obtn" style="justify-content:center">확인</button>'+
   '<div class="lnote"><span>폰을 바꾸거나 잃어버렸으면 다른 관리자에게 OTP 초기화를 요청하세요.</span></div><button type="button" class="linkbtn" id="oout">로그아웃</button></form>');
  bindOtp(f.id);
}
function otpInputs(){var h='<div class="otp">';for(var i=0;i<6;i++)h+='<input id="o'+i+'" inputmode="numeric" autocomplete="one-time-code" maxlength="1" aria-label="'+(i+1)+'번째 숫자">';return h+'</div>';}
function bindOtp(factorId){
  var f=document.getElementById('fOtp');document.getElementById('oout').onclick=logout;
  var ins=f.querySelectorAll('.otp input');ins[0].focus();
  f.addEventListener('input',function(e){var t=e.target;if(!t.matches('.otp input'))return;var v=t.value.replace(/[^0-9]/g,'');
    if(v.length>1){for(var i=0;i<6;i++)ins[i].value=v[i]||'';ins[Math.min(5,v.length-1)].focus();return;}
    t.value=v;if(v&&t.nextElementSibling)t.nextElementSibling.focus();});
  f.addEventListener('keydown',function(e){if(e.key==='Backspace'&&e.target.matches('.otp input')&&!e.target.value&&e.target.previousElementSibling)e.target.previousElementSibling.focus();});
  f.addEventListener('submit',async function(e){e.preventDefault();
    var code='';ins.forEach(function(x){code+=x.value;});var er=document.getElementById('oerr'),bt=document.getElementById('obtn');
    if(!/^[0-9]{6}$/.test(code)){er.textContent='6자리 숫자를 모두 입력하세요.';return;}
    bt.disabled=true;var r=await sb.auth.mfa.challengeAndVerify({factorId:factorId,code:code});
    if(r.error){er.textContent='숫자가 맞지 않습니다. 앱에 새로 뜬 숫자로 다시 입력하세요.';bt.disabled=false;ins.forEach(function(x){x.value='';});ins[0].focus();return;}
    afterSignIn();});
}
async function logout(msg){stopIdle();try{await sb.auth.signOut();}catch(e){}
  try{sessionStorage.removeItem('chm-sites-rec');}catch(e){}
  S.me=null;S.detail=null;S.audit=null;S.sites=[];S.staff=[];S.visits=[];S.members=[];S.managers=[];
  showLogin(typeof msg==='string'?msg:'');}

/* 30분 미사용 자동 로그아웃 */
var lastAct=Date.now(),idleT=null;
function mark(){lastAct=Date.now();}
function startIdle(){stopIdle();['click','keydown','touchstart','scroll'].forEach(function(ev){document.addEventListener(ev,mark,{passive:true,capture:true});});
  idleT=setInterval(function(){if(Date.now()-lastAct>IDLE_MIN*60e3)logout('30분 동안 사용하지 않아 로그아웃되었습니다.');},30e3);}
function stopIdle(){if(idleT)clearInterval(idleT);idleT=null;}

/* ---------- 데이터 ---------- */
async function loadAll(){
  var r=await Promise.all([
    q(sb.from('site_clients').select('id,name,sort').order('sort')),
    q(sb.from('site_sites').select('*').order('sort').order('id')),
    q(sb.from('site_staffing').select('id,site_id,zone,job,quota,current,base_date')),
    q(sb.from('site_codes').select('*').order('grp').order('sort')),
    q(sb.from('site_members').select('user_id,login_id,name,role,active,must_change_pw,last_login_at,created_at').order('created_at')),
    q(sb.from('site_assign').select('user_id,site_id')),
    q(sb.from('site_visits').select('*').order('visit_date',{ascending:false}).order('id',{ascending:false}).limit(500)),
    q(sb.from('site_managers').select('*').order('sort').order('id'))]);
  S.clients=r[0];S.sites=r[1];S.staff=r[2];S.codes=r[3];S.members=r[4];S.assign=r[5];S.visits=r[6];S.managers=r[7];
  S.me.sites=S.assign.filter(function(a){return a.user_id===S.me.user_id;}).map(function(a){return a.site_id;});
  if(!S.siteId||!byId(S.sites,S.siteId)){var f=activeSites()[0];S.siteId=f?f.id:null;}
  if(!S.su){var u=S.members.filter(function(m){return m.role!=='admin';})[0];S.su=u?u.user_id:null;}
  S.detailFor=null;
}
/* 지금 고른 회사(CHM·CHMS)의 운영 중 사업장 — 대시보드·목록·설정이 모두 이 목록을 씀 */
function activeSites(){return S.sites.filter(function(s){return s.status==='운영'&&(s.company||'CHM')===S.company;});}
function coVisits(){var ids={};activeSites().forEach(function(s){ids[s.id]=1;});return S.visits.filter(function(v){return ids[v.site_id];});}
function coTabs(){return '<div class="coseg" role="group" aria-label="회사 선택">'+COMPANIES.map(function(c){return '<button type="button" data-co="'+c+'" class="co-'+c.toLowerCase()+'" aria-pressed="'+(S.company===c)+'">'+c+'</button>';}).join('')+'</div>';}
function setCompany(c){if(COMPANIES.indexOf(c)<0||S.company===c)return;S.company=c;try{localStorage.setItem('chm-sites-company',c);}catch(e){}
  var f=activeSites()[0];S.siteId=f?f.id:null;S.detailFor=null;S.detail=null;S.open=false;S.imp=null;S.histNames=null;S.zone='전체';S.client='전체';render();var mn=document.getElementById('main');if(mn)mn.scrollTop=0;}
function latestRows(siteId){var rows=S.staff.filter(function(r){return r.site_id===siteId;});if(!rows.length)return[];
  var mx=rows.reduce(function(m,r){return r.base_date>m?r.base_date:m;},'');return rows.filter(function(r){return r.base_date===mx;});}
function staffOf(siteId,zone){var t=CATS.map(function(){return[0,0];});latestRows(siteId).forEach(function(r){if(zone&&zone!=='전체'&&r.zone!==zone)return;var k=CATS.indexOf(r.job);if(k>=0){t[k][0]=Math.round((t[k][0]+Number(r.quota))*10)/10;t[k][1]=Math.round((t[k][1]+Number(r.current))*10)/10;}});return t;}
function totOf(siteId){return staffOf(siteId).reduce(function(p,v){return[p[0]+v[0],p[1]+v[1]];},[0,0]);}
function baseDateOf(siteId){var l=latestRows(siteId);return l.length?l[0].base_date:null;}
function zonesOf(siteId){var z=[];latestRows(siteId).forEach(function(r){if(z.indexOf(r.zone)<0)z.push(r.zone);});return z;}
async function loadDetail(siteId,force){
  if(!force&&S.detailFor===siteId&&S.detail)return;
  var r=await Promise.all([
    q(sb.from('site_contacts').select('*').eq('site_id',siteId).order('sort').order('id')),
    q(sb.from('site_notes').select('*').eq('site_id',siteId).order('note_date',{ascending:false}).order('id',{ascending:false})),
    q(sb.from('site_equipment').select('*').eq('site_id',siteId).order('id')),
    q(sb.from('site_visits').select('*').eq('site_id',siteId).order('visit_date',{ascending:false}).order('id',{ascending:false})),
    q(sb.from('site_photos').select('*').eq('site_id',siteId).order('id')),
    q(sb.from('site_people').select('*').eq('site_id',siteId).order('sort').order('id'))]);
  S.detail={contacts:r[0],notes:r[1],equip:r[2],visits:r[3],photos:r[4],people:r[5]};S.detailFor=siteId;
  await signPhotos(r[4]);
}
async function refreshSite(siteId){
  var r=await Promise.all([q(sb.from('site_sites').select('*').eq('id',siteId).single()),
    q(sb.from('site_staffing').select('id,site_id,zone,job,quota,current,base_date').eq('site_id',siteId)),
    q(sb.from('site_managers').select('*').eq('site_id',siteId).order('sort').order('id')),
    q(sb.from('site_visits').select('*').order('visit_date',{ascending:false}).order('id',{ascending:false}).limit(500))]);
  S.sites=S.sites.map(function(s){return s.id===siteId?r[0]:s;});
  S.staff=S.staff.filter(function(x){return x.site_id!==siteId;}).concat(r[1]);
  S.managers=S.managers.filter(function(x){return x.site_id!==siteId;}).concat(r[2]);
  S.visits=r[3];
  await loadDetail(siteId,true);
}

/* ---------- 대시보드 ---------- */
function viewDash(){
  var act=activeSites(),tot=[0,0],cat=CATS.map(function(){return[0,0];});
  act.forEach(function(s){staffOf(s.id).forEach(function(v,k){cat[k][0]+=v[0];cat[k][1]+=v[1];tot[0]+=v[0];tot[1]+=v[1];});});
  var gap=tot[0]-tot[1],rate=tot[0]?(tot[1]/tot[0]*100).toFixed(1):'0.0';
  var short=act.map(function(s){var t=totOf(s.id);return{s:s,g:t[0]-t[1],t:t};}).filter(function(x){return x.g>0;}).sort(function(a,b){return b.g-a.g;});
  var max=Math.max.apply(null,cat.map(function(c){return c[0];}).concat([1]));
  var dates=act.map(function(s){return baseDateOf(s.id);}).filter(Boolean).sort();
  var basis=dates.length?(dates[0]===dates[dates.length-1]?'인원 기준일 '+dates[0]:'인원 기준일 '+dates[0]+' ~ '+dates[dates.length-1]):'인원 자료 없음';
  var bars=CATS.map(function(c,k){var g=cat[k][0]-cat[k][1];return '<div class="bar"><span>'+c+'</span><span class="tr"><span class="fl" style="width:'+(cat[k][1]/max*100)+'%"></span></span><span class="v">'+fmt(cat[k][1])+' / '+fmt(cat[k][0])+(g>0?' <em>−'+g+'</em>':'')+'</span></div>';}).join('');
  var shortRows=short.slice(0,10).map(function(x){return '<button type="button" class="rowi" data-go="'+x.s.id+'"><span class="grow"><b>'+esc(x.s.name)+'</b> <span class="muted">· '+esc(clientName(x.s.client_id))+'</span></span><span class="num muted">'+x.t[1]+'/'+x.t[0]+'</span><span class="chip bad">결원 '+x.g+'</span></button>';}).join('')||'<div class="empty">결원이 있는 사업장이 없습니다.</div>';
  var vrows=coVisits().slice(0,6).map(visitRow).join('')||'<div class="empty">아직 방문기록이 없습니다.</div>';
  return '<div class="page">'+coTabs()+'<div class="ph"><div><h1>대시보드 <span class="chip co-chip co-'+S.company.toLowerCase()+'">'+esc(S.company)+'</span></h1><p>'+esc(basis)+' · 본사 제외</p></div><div class="actions">'+(isAdmin()?'<button type="button" class="btn sm" data-act="go-imp">엑셀로 인원 반영</button>':'')+'<button type="button" class="btn sm" data-act="reload">새로고침</button></div></div>'+
   '<div class="kpis"><div class="kpi"><small>사업장</small><b>'+act.length+'</b></div><div class="kpi"><small>정원</small><b>'+fmt(tot[0])+'</b></div><div class="kpi"><small>현원</small><b>'+fmt(tot[1])+'</b></div><div class="kpi alert"><small>결원</small><b>'+fmt(gap)+'</b></div><div class="kpi"><small>충원율</small><b>'+rate+'%</b></div></div>'+
   '<div class="dgrid"><section class="card"><h3>직군별 현원 / 정원</h3><div class="bars">'+bars+'</div></section>'+
   '<section class="card"><h3>결원이 있는 사업장 <span class="chip bad r">'+short.length+'곳</span></h3><div class="rows">'+shortRows+'</div></section></div>'+
   '<section class="card"><h3>최근 방문기록<button type="button" class="btn sm r" data-nav="visits">전체 보기</button></h3><div class="rows">'+vrows+'</div></section></div>';
}
function purposeText(v){return v.purpose==='기타'&&v.purpose_etc?v.purpose_etc:v.purpose;}
function visitRow(v){var s=byId(S.sites,v.site_id);return '<button type="button" class="rowi" data-go="'+v.site_id+'" data-gotab="basic"><span class="num muted" style="font-size:12px">'+esc(v.visit_date.slice(5))+'</span><span class="chip acc">'+esc(purposeText(v))+'</span><span class="grow"><b>'+esc(s?s.name:'')+'</b> <span class="muted">· '+esc(v.content)+'</span></span></button>';}

  return activeSites().filter(function(s){
    if(t&&s.name.indexOf(t)<0&&clientName(s.client_id).indexOf(t)<0)return false;
    if(S.client!=='전체'&&String(s.client_id)!==S.client)return false;
    if(S.short){var x=totOf(s.id);if(x[0]-x[1]<=0)return false;}
    if(S.mine&&S.me.sites.indexOf(s.id)<0)return false;return true;});}

  var list=filtered();

    return '<button type="button" class="si" data-site="'+s.id+'"'+(S.siteId===s.id?' aria-current="true"':'')+'><span class="nm">'+esc(s.name)+(mine?'<span class="star" title="담당">★</span>':'')+'</span><span class="hc"><span class="num">'+t[1]+'/'+t[0]+'</span>'+(g>0?'<small class="chip bad">−'+g+'</small>':'')+'</span><span class="sub">'+esc(clientName(s.client_id))+(zn>1?' · 구역 '+zn:'')+'</span></button>';}).join('');

   '<label class="search">'+I.search+'<input id="q" type="search" placeholder="사업장·고객사 검색" value="'+esc(S.q)+'"></label>'+
   '<div class="filters"><select id="fc" aria-label="고객사"><option value="전체">고객사 전체</option>'+S.clients.filter(function(c){return activeSites().some(function(s){return s.client_id===c.id;});}).map(function(c){return '<option value="'+c.id+'"'+(S.client===String(c.id)?' selected':'')+'>'+esc(c.name)+'</option>';}).join('')+'</select>'+
   '<button type="button" class="fchip" id="fs" aria-pressed="'+S.short+'">결원</button>'+(!isAdmin()?'<button type="button" class="fchip" id="fm" aria-pressed="'+S.mine+'">★ 내 담당</button>':'')+'</div></div>'+

function tabStaff(s,ed){
  var zones=zonesOf(s.id);var multi=zones.length>1||(zones.length===1&&zones[0]!=='');
  if(!multi||(S.zone!=='전체'&&zones.indexOf(S.zone)<0))S.zone='전체';
  var a=staffOf(s.id,S.zone),tt=[0,0];
  var rows=CATS.map(function(c,k){tt[0]+=a[k][0];tt[1]+=a[k][1];if(!a[k][0]&&!a[k][1])return '';var g=a[k][1]-a[k][0];return '<tr><td>'+c+'</td><td class="n num">'+a[k][0]+'</td><td class="n num">'+a[k][1]+'</td><td class="n num" style="color:'+(g<0?'var(--bad)':'var(--ink-3)')+'">'+(g>0?'+'+g:g)+'</td></tr>';}).join('');

async function loadHist(siteId,refresh){
  S.hist[siteId]={loading:true};
  try{var r=await sb.functions.invoke('site-history',{body:{site_id:siteId,refresh:!!refresh}});
    if(r.error){var msg=r.error.message;try{var j=await r.error.context.json();if(j&&j.error)msg=j.error;}catch(e){}throw new Error(msg);}
    S.hist[siteId]={data:r.data};}
  catch(e){S.hist[siteId]={error:errMsg(e)};}
  if(S.view==='sites'&&S.siteId===siteId&&S.tab==='hist'){var d=document.getElementById('detail');if(d){var sc=d.scrollTop;d.innerHTML=viewDetail();d.scrollTop=sc;}}
}

/* ---------- 인원현황 엑셀 반영 (관리자) ----------
   외부 라이브러리 없이 브라우저 기본 기능(DecompressionStream·DOMParser)으로 xlsx를 읽습니다.

async function unzipXlsx(buf){

  var cnt=dv.getUint16(eocd+10,true),off=dv.getUint32(eocd+16,true),files={};
  for(var k=0;k<cnt;k++){

    var nl=dv.getUint16(off+28,true),el=dv.getUint16(off+30,true),cl=dv.getUint16(off+32,true);
    files[dec.decode(u8.subarray(off+46,off+46+nl))]={m:dv.getUint16(off+10,true),cs:dv.getUint32(off+20,true),us:dv.getUint32(off+24,true),lh:dv.getUint32(off+42,true)};
    off+=46+nl+el+cl;
  }
  return async function(p){var f=files[p];if(!f)return null;if(f.us>50*1024*1024)throw new Error('엑셀 내용이 너무 큽니다');
    var st=f.lh+30+dv.getUint16(f.lh+26,true)+dv.getUint16(f.lh+28,true),data=u8.subarray(st,st+f.cs);
    if(f.m===0)return dec.decode(data);
    if(f.m!==8)throw new Error('지원하지 않는 압축 형식입니다');
    if(!window.DecompressionStream)throw new Error('이 브라우저는 엑셀 읽기를 지원하지 않습니다. 최신 크롬·엣지·사파리에서 해 주세요');
    return await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();};
}
function xdoc(t){var d=new DOMParser().parseFromString(t||'<x/>','application/xml');if(d.getElementsByTagName('parsererror').length)throw new Error('엑셀 내용을 읽지 못했습니다');return d;}

async function readXlsx(file){
  if(!/\.xlsx$/i.test(file.name))throw new Error('xlsx 형식의 엑셀 파일을 골라 주세요 (xls는 엑셀에서 xlsx로 다시 저장)');
  if(file.size>10*1024*1024)throw new Error('파일이 너무 큽니다 (10MB 이하)');

      xtags(r,'c').forEach(function(c,ci){var col=c.getAttribute('r')?xcol(c.getAttribute('r')):ci;if(col<0||col>200)return;var t=c.getAttribute('t'),v=xtags(c,'v')[0],val=null;
        if(t==='s')val=v?ss[Number(v.textContent)]:null;else if(t==='inlineStr')val=xtags(c,'t').map(function(x){return x.textContent;}).join('');
        else if(t==='str')val=v?v.textContent:null;else if(t==='e'||t==='b')val=null;else val=v&&v.textContent!==''?Number(v.textContent):null;
        arr[col]=val;});});
    out.push({name:sh.getAttribute('name'),rows:rows});
  }

}
function xlsxDate(sheets){var re=/(20\d{2})\s*[년.\-\/]\s*(\d{1,2})\s*[월.\-\/]\s*(\d{1,2})/;
  for(var i=0;i<sheets.length;i++)for(var r=0;r<6;r++){var row=sheets[i].rows[r]||[];for(var c=0;c<row.length;c++){var v=row[c];
    if(typeof v==='string'){var m=re.exec(v);if(m)return m[1]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[3]).slice(-2);}
    else if(typeof v==='number'&&v>43000&&v<60000){var d=new Date(Date.UTC(1899,11,30)+Math.round(v)*864e5);return d.toISOString().slice(0,10);}}}
  return null;}
var nj=function(s){return String(s==null?'':s).replace(/\s+/g,'');};
/* '사옥'(또는 사업장) 제목 줄과 직군 제목(관리·사무지원·시설·보안·CS·미화)을 찾아 인원을 읽음
   - CHM 양식: 직군마다 정원·현원·과부족 칸
   - CHMS 양식: 직군마다 세부 칸(사옥·전력·계 / 보안·CS·계 / 남자·여자·계) — 현원만 있어 정원=현원으로 반영, 보안·CS는 따로 */
function parseStaffSheet(rows){
  for(var h=0;h<Math.min(rows.length,30);h++){var hr=rows[h]||[],nameCol=-1,heads=[];
    for(var c=0;c<hr.length;c++){var t=nj(hr[c]);if(t==='사옥'||t==='사업장'||t==='사업장명')nameCol=c;if(t)heads.push([t,c]);}
    var jobs0=heads.filter(function(x){return CATS.indexOf(x[0])>=0;});
    if(nameCol<0||!jobs0.length)continue;
    var sub=rows[h+1]||[],cols=[];
    jobs0.forEach(function(j){var nx=heads.filter(function(x){return x[1]>j[1];})[0],end=nx?nx[1]:j[1]+3,qc=-1,cc=-1,parts=[],tot=-1;
      for(var k=j[1];k<end;k++){var st=nj(sub[k]);if(st==='정원')qc=k;else if(st==='현원')cc=k;else if(st==='계'||st==='합계'||st==='소계')tot=k;else if(CATS.indexOf(st)>=0)parts.push([st,k]);}
      if(qc>=0||cc>=0)cols.push([j[0],qc>=0?qc:cc,cc>=0?cc:qc]);
      else if(parts.length)parts.forEach(function(p){cols.push([p[0],p[1],p[1]]);});
      else if(tot>=0)cols.push([j[0],tot,tot]);
      else cols.push([j[0],j[1],j[1]+1]);});
    var list=[],blank=0,sec='';
    for(var r=h+2;r<rows.length;r++){var row=rows[r]||[],nm=String(row[nameCol]==null?'':row[nameCol]).replace(/\s+/g,' ').trim();
      if(nameCol>0&&row[0]!=null&&String(row[0]).trim())sec=String(row[0]).replace(/\s+/g,'').trim();
      if(!nm){if(++blank>3)break;continue;}blank=0;
      if(/^(합\s*계|소\s*계|계|총\s*계)$/.test(nm))continue;
      var jb={},any=false;cols.forEach(function(j){var qv=Math.max(0,Math.round((Number(row[j[1]])||0)*10)/10),cv=Math.max(0,Math.round((Number(row[j[2]])||0)*10)/10);
        if(qv||cv){var o=jb[j[0]]||(jb[j[0]]=[0,0]);o[0]+=qv;o[1]+=cv;any=true;}});
      list.push({raw:nm,sec:sec,jobs:jb,empty:!any});}
    return list;}
  return null;}
function nkey(s){return String(s||'').toLowerCase().replace(/[\s()\[\]\-_.·ㆍ\/&（）]/g,'');}
function alList(v){return String(v||'').split(',').map(function(x){return nkey(x);}).filter(Boolean);}
/* 다른 회사와 이름이 같아 뒤에 (CHMS)·(CHM)을 붙인 사업장도 엑셀의 원래 이름으로 찾도록 */
function snk(s){return nkey(String(s.name||'').replace(/\s*[(（](CHMS|CHM)[)）]\s*$/i,''));}
function impMatch(raw,sec){
  var m=/^(.*?)\s*[(（](.+?)[)）]\s*$/.exec(raw),base=m?m[1].trim():raw,inner=m?m[2].trim():'';
  var zone=inner?(/공용/.test(inner)?'공용부':/전용/.test(inner)?'전용부':inner.replace(/\s*전용부?$/,'')+' 전용부'):'';
  var sites=activeSites(),kr=nkey(raw),kb=nkey(base);
  var hit;if(sec){hit=sites.filter(function(s){return nkey(s.name)===nkey(raw+'('+sec+')');});if(hit.length===1)return{site:hit[0].id,zone:'',base:base};}
  hit=sites.filter(function(s){return nkey(s.name)===kr;});if(hit.length===1)return{site:hit[0].id,zone:'',base:base};
  hit=sites.filter(function(s){return snk(s)===kr;});if(hit.length===1)return{site:hit[0].id,zone:'',base:base};
  hit=sites.filter(function(s){return nkey(s.name)===kb||snk(s)===kb||alList((s.aliases||{}).staff).indexOf(kb)>=0;});if(hit.length===1)return{site:hit[0].id,zone:zone,base:base};
  hit=sites.filter(function(s){var a=s.aliases||{};return alList(a.edu).concat(alList(a.safety)).indexOf(kb)>=0;});if(hit.length===1)return{site:hit[0].id,zone:zone,base:base};
  if(kb.length>=2){hit=sites.filter(function(s){var k=nkey(s.name);return k.indexOf(kb)>=0||(k.length>=2&&kb.indexOf(k)>=0);});if(hit.length===1)return{site:hit[0].id,zone:zone,base:base};}

async function impLoad(file){
  try{toast('엑셀 읽는 중…');var sh=await readXlsx(file),pick=null,list=null;
    var dk=function(n){var m=/^(20\d{2})[.\-](\d{1,2})[.\-](\d{1,2})\.?$/.exec(String(n).trim());return m?Number(m[1])*10000+Number(m[2])*100+Number(m[3]):0;};
    var order=sh.slice().sort(function(a,b){var pa=/사옥별|사업장별/.test(a.name)?1:0,pb=/사옥별|사업장별/.test(b.name)?1:0;if(pa!==pb)return pb-pa;return dk(b.name)-dk(a.name);});
    for(var i=0;i<order.length;i++){list=parseStaffSheet(order[i].rows);if(list&&list.length){pick=order[i];break;}}
    if(!pick)throw new Error('「사옥」 제목과 직군(관리·시설·보안·미화…) 제목이 있는 시트를 찾지 못했습니다');

      rows:list.filter(function(x){return !x.empty;}).map(function(x){var mm=impMatch(x.raw,x.sec);return{raw:x.raw,base:mm.base,zone:mm.zone,site:mm.site,auto:!!mm.site,jobs:x.jobs};})};
    S.keepScroll=true;render();toast('「'+pick.name+'」 시트에서 '+S.imp.rows.length+'줄을 읽었습니다. 확인 후 반영을 누르세요',5000);

  var list=activeSites().filter(function(x){return x.addr&&!x.building_id;});if(!list.length)return;

    try{var r=await sb.functions.invoke('site-building',{body:{site_id:list[i].id}});
      if(r.error){var msg=r.error.message;try{var j=await r.error.context.json();if(j&&j.error)msg=j.error;}catch(e){}throw new Error(msg);}ok++;}
    catch(x){fail.push(list[i].name+': '+errMsg(x));}}
  await loadAll();S.keepScroll=true;render();
  if(fail.length)openForm({title:'건축물대장 일괄 조회 결과',fields:[{id:'x',type:'info',html:'<span>'+ok+'곳 완료 · '+fail.length+'곳 실패 (주소를 확인해 고친 뒤 사업장 상세 › 기본현황에서 「불러오기」)</span><ul style="margin:6px 0 0;padding-left:18px">'+fail.map(function(f){return '<li>'+esc(f)+'</li>';}).join('')+'</ul>'}],saveLabel:'닫기',onSave:function(){}});
  else toast(ok+'곳 모두 건축물대장을 반영하고 빌딩정보시스템에 연결했습니다',6000);
}
/* 새 고객사 만들기 (같은 이름이 있으면 그걸 씀) */
async function newClient(name){name=String(name||'').trim();if(!name)throw new Error('새 고객사명을 입력하세요.');
  var ex=S.clients.filter(function(c){return c.name.replace(/\s/g,'')===name.replace(/\s/g,'');})[0];if(ex)return ex.id;
  var ins=await q(sb.from('site_clients').insert({name:name,sort:S.clients.reduce(function(m,c){return Math.max(m,c.sort||0);},0)+1}).select().single());
  S.clients=await q(sb.from('site_clients').select('id,name,sort').order('sort'));return ins.id;}
/* 사업장 상세 › 고객사 탭에서 바로 고객사 바꾸기·추가 (관리자) */
function clientSetForm(s){if(!s)return;
  openForm({title:'고객사 변경·추가 · '+s.name,fields:[{id:'client',label:'고객사',type:'select',value:s.client_id,options:S.clients.map(function(c){return{value:c.id,label:c.name};}).concat([{value:'new',label:'+ 새 고객사 추가'}])},
    {id:'newclient',label:'새 고객사명',hidden:true,maxlength:40,placeholder:'예: 현대차그룹'}],
    onChange:function(e,val){if(e.target.id==='f_client'){var w=document.querySelector('[data-wrap="newclient"]');if(w){w.hidden=val.client!=='new';if(!w.hidden)document.getElementById('f_newclient').focus();}}},
    onSave:async function(v){var cid=v.client==='new'?await newClient(v.newclient):Number(v.client);
      if(cid!==s.client_id)await q(sb.from('site_sites').update({client_id:cid}).eq('id',s.id));await afterSave('고객사를 저장했습니다',s.id);}});
}
function clientForm(c){
  openForm({title:c?'고객사 이름 수정':'고객사 추가',fields:[{id:'name',label:'고객사명',required:true,value:c&&c.name}],
    onSave:async function(v){if(c)await q(sb.from('site_clients').update({name:v.name}).eq('id',c.id));else await q(sb.from('site_clients').insert({name:v.name,sort:S.clients.length+1}));
      S.clients=await q(sb.from('site_clients').select('id,name,sort').order('sort'));S.keepScroll=true;render();toast('고객사를 저장했습니다');}});
}

/* ---------- 내 계정 (폰) ---------- */
function meMenu(){var m=openForm({title:S.me.name+' ('+S.me.login_id+')',fields:[{id:'x',type:'info',html:'<span>'+(isAdmin()?'관리자 · 전체 입력·수정':'담당 사업장 '+S.me.sites.length+'곳')+'</span><div class="actions" style="margin-top:8px"><button type="button" class="btn" data-act="pw">비밀번호 변경</button><button type="button" class="btn" data-act="logout">로그아웃</button>'+installHtml().replace('<button type="button"','<button type="button" class="btn"')+'</div><span class="muted">'+VERSION+'</span>'}],saveLabel:'닫기',onSave:function(){}});m.querySelector('[data-close]').remove();}


/* ---------- 사진 ---------- */
var BUCKET='site-photos';S.purl={};S.purlAt=0;
async function signPhotos(list){
  var paths=list.map(function(p){return p.path;});if(!paths.length){S.purlAt=Date.now();return;}
  try{var r=await sb.storage.from(BUCKET).createSignedUrls(paths,600);(r.data||[]).forEach(function(x){if(x.signedUrl)S.purl[x.path]=x.signedUrl;});S.purlAt=Date.now();}catch(e){}
}
function photosOf(type,id){return (S.detail&&S.detail.photos||[]).filter(function(p){return p.target_type===type&&p.target_id===id;});}
function thumb(p){var u=S.purl[p.path];return '<button type="button" class="pthumb" data-act="photo-view" data-id="'+p.id+'" aria-label="사진 크게 보기">'+(u?'<img alt="" loading="lazy" src="'+esc(u)+'">':'')+'</button>';}
function addTile(type,id,label){return '<label class="pthumb add" title="사진 추가">'+(label||'+ 사진')+'<input type="file" accept="image/*" multiple hidden data-ptype="'+type+'" data-pid="'+id+'"></label>';}
function photoStrip(type,id,ed,emptyText){var list=photosOf(type,id);
  if(!list.length&&!ed)return emptyText?'<div class="muted" style="font-size:12px">'+esc(emptyText)+'</div>':'';
  return '<div class="pstrip">'+list.map(thumb).join('')+(ed?addTile(type,id):'')+'</div>';}
function faceSlot(m,ed,type){type=type||'manager_face';var f=photosOf(type,m.id)[0];
  if(f)return '<button type="button" class="photo face" data-act="photo-view" data-id="'+f.id+'" aria-label="얼굴 사진 보기">'+(S.purl[f.path]?'<img alt="" src="'+esc(S.purl[f.path])+'">':'')+'</button>';
  if(ed&&m.photo_consent_on)return '<label class="photo face add" title="얼굴 사진 올리기">+ 사진<input type="file" accept="image/*" hidden data-ptype="'+type+'" data-pid="'+m.id+'"></label>';
  return '<span class="photo">'+(m.photo_consent_on?'사진 없음':'동의 전')+'</span>';}
function shrink(file){return new Promise(function(res,rej){
  var done=function(src,w,h,rel){var k=Math.min(1,1600/Math.max(w,h));var c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);
    c.getContext('2d').drawImage(src,0,0,c.width,c.height);if(rel)rel();c.toBlob(function(b){b?res(b):rej(new Error('사진을 변환하지 못했습니다'));},'image/jpeg',0.82);};
  if(window.createImageBitmap){createImageBitmap(file,{imageOrientation:'from-image'}).then(function(bm){done(bm,bm.width,bm.height,function(){bm.close&&bm.close();});}).catch(fallback);}else fallback();
  function fallback(){var u=URL.createObjectURL(file),im=new Image();im.onload=function(){done(im,im.naturalWidth,im.naturalHeight,function(){URL.revokeObjectURL(u);});};im.onerror=function(){URL.revokeObjectURL(u);rej(new Error('사진 파일을 읽지 못했습니다 ('+file.name+')'));};im.src=u;}
});}
function uid(){if(crypto.randomUUID)return crypto.randomUUID();var a=new Uint8Array(16);crypto.getRandomValues(a);return [].map.call(a,function(x){return ('0'+x.toString(16)).slice(-2);}).join('');}
async function uploadPhotos(type,targetId,files){
  var sid=S.siteId,ok=0;files=[].slice.call(files,0,10);
  var face=type==='manager_face'||type==='person_face';var before=face?photosOf(type,targetId):[];
  if(face)files=files.slice(0,1);
  for(var i=0;i<files.length;i++){
    toast('사진 올리는 중… ('+(i+1)+'/'+files.length+')');
    try{var blob=await shrink(files[i]);
      var path=sid+'/'+type+'/'+uid()+'.jpg';
      var up=await sb.storage.from(BUCKET).upload(path,blob,{contentType:'image/jpeg',upsert:false,cacheControl:'3600'});
      if(up.error)throw up.error;
      var ins=await sb.from('site_photos').insert({site_id:sid,target_type:type,target_id:targetId,path:path,taken_on:today()});
      if(ins.error){await sb.storage.from(BUCKET).remove([path]);throw ins.error;}
      ok++;}
    catch(e){toast(errMsg(e));}
  }
  if(ok&&face){for(var j=0;j<before.length;j++){try{await removePhoto(before[j]);}catch(e){}}}
  if(ok){await loadDetail(sid,true);openDetail(sid,true);toast('사진 '+ok+'장을 올렸습니다');}
}
async function removePhoto(p){var r=await sb.storage.from(BUCKET).remove([p.path]);if(r.error)throw r.error;await q(sb.from('site_photos').delete().eq('id',p.id));}
async function removePhotosFor(type,id){var list=photosOf(type,id);for(var i=0;i<list.length;i++)await removePhoto(list[i]);}
async function removeNotesFor(type,id){var ns=S.detail?S.detail.notes.filter(function(n){return n.target_type===type&&n.target_id===id;}):[];
  for(var i=0;i<ns.length;i++){await removePhotosFor('note',ns[i].id);await q(sb.from('site_notes').delete().eq('id',ns[i].id));}}
function photoView(id){
  var p=(S.detail.photos||[]).filter(function(x){return x.id===id;})[0];if(!p)return;var ed=canEdit(p.site_id);
  var m=openForm({title:'사진',fields:[{id:'x',type:'info',html:'<img class="pbig" alt="사진" src="'+esc(S.purl[p.path]||'')+'"><span>'+esc(p.taken_on||'')+' · 올린 사람 '+esc(memberName(p.created_by))+'</span>'}],
    saveLabel:'닫기',onSave:function(){},deleteLabel:'사진 삭제',onDelete:ed?async function(){await removePhoto(p);await loadDetail(S.siteId,true);openDetail(S.siteId,true);toast('사진을 삭제했습니다');}:null});
  var c=m.querySelector('[data-close]');if(c)c.remove();
}
app.addEventListener('change',function(e){var t=e.target;if(!t.dataset||!t.dataset.ptype||!t.files||!t.files.length)return;
  var files=[].slice.call(t.files);t.value='';uploadPhotos(t.dataset.ptype,Number(t.dataset.pid),files);});
/* 서명 링크 만료 전에 다시 받기 (10분 링크, 8분마다 갱신) */
setInterval(function(){if(S.me&&S.detail&&S.view==='sites'&&Date.now()-S.purlAt>480e3){signPhotos(S.detail.photos).then(function(){openDetail(S.siteId,true);});}},60e3);

/* ---------- 계정 잠금 표시 ---------- */
function isLocked(login){var x=S.locks&&S.locks[login];return !!(x&&x.locked_until&&new Date(x.locked_until).getTime()>Date.now());}
function lockChip(login){if(isLocked(login)){var mn=Math.ceil((new Date(S.locks[login].locked_until).getTime()-Date.now())/60000);return '<span class="chip bad">잠김 '+mn+'분</span> ';}
  var x=S.locks&&S.locks[login];return x&&x.fails?'<span class="chip warn">실패 '+x.fails+'회</span> ':'';}

/* ---------- 앱 설치 (PWA) ---------- */
S.installEvt=null;
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();S.installEvt=e;if(S.me){S.keepScroll=true;render();}});
window.addEventListener('appinstalled',function(){S.installEvt=null;toast('앱을 설치했습니다');if(S.me){S.keepScroll=true;render();}});
function isStandalone(){return (window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;}
function isIOS(){return /iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);}
function installHtml(){if(isStandalone())return '';
  if(S.installEvt)return '<button type="button" data-act="install">앱으로 설치</button>';
  if(isIOS())return '<span class="muted" style="font-size:11.5px">아이폰: Safari 공유 버튼 › 홈 화면에 추가</span>';return '';}
async function doInstall(){if(!S.installEvt)return;S.installEvt.prompt();try{await S.installEvt.userChoice;}catch(e){}S.installEvt=null;S.keepScroll=true;render();}
if('serviceWorker' in navigator&&location.protocol==='https:'){window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){});});}

/* ---------- 이벤트 ---------- */
app.addEventListener('click',async function(e){
  var el=e.target.closest('button,[data-go]');if(!el||!app.contains(el))return;
  if(el.closest('#modal')&&!el.dataset.act&&!el.dataset.tel)return;
  var act=el.dataset.act;
  if(el.dataset.nav){S.view=el.dataset.nav;S.open=false;if(S.view==='set'&&S.stab==='audit')S.audit=null;render();document.getElementById('main').scrollTop=0;return;}
  if(el.dataset.go){closeModal();S.view='sites';S.siteId=Number(el.dataset.go);S.tab=el.dataset.gotab||'client';S.open=true;S.zone='전체';render();return;}
  if(el.dataset.site){S.siteId=Number(el.dataset.site);S.open=true;S.zone='전체';S.keepScroll=true;
    app.querySelectorAll('.si[aria-current]').forEach(function(x){x.removeAttribute('aria-current');});el.setAttribute('aria-current','true');
    document.querySelector('.sites').setAttribute('data-open','1');var d=document.getElementById('detail');d.innerHTML=viewDetail();d.scrollTop=0;openDetail(S.siteId,false);return;}
  if(el.dataset.tab&&el.getAttribute('role')==='tab'){S.tab=el.dataset.tab;var d2=document.getElementById('detail');d2.innerHTML=viewDetail();return;}
  if(el.dataset.zone!==undefined&&el.classList.contains('fchip')&&el.closest('.detail')){S.zone=el.dataset.zone;document.getElementById('detail').innerHTML=viewDetail();return;}
  if(el.id==='fs'){S.short=!S.short;render();return;}
  if(el.id==='fm'){S.mine=!S.mine;render();return;}
  if(el.dataset.co){setCompany(el.dataset.co);return;}
  if(el.dataset.vp){S.vp=el.dataset.vp;render();return;}
  if(el.dataset.stab){S.stab=el.dataset.stab;if(S.stab==='audit')S.audit=null;render();return;}
  if(el.dataset.tel){if(el.textContent===el.dataset.full)return;var p=el.dataset.tel.split(':');
    try{await q(sb.rpc('site_log_view',{p_kind:p[0],p_id:Number(p[1])}));el.textContent=el.dataset.full;toast('전체 번호 표시 · 열람이 기록되었습니다');}catch(x){toast(errMsg(x));}return;}
  var s=byId(S.sites,S.siteId),id=Number(el.dataset.id);
  switch(act){
    case 'logout':closeModal();logout();return;
    case 'pw':closeModal();showChangePw(false);return;
    case 'menu':meMenu();return;
    case 'reload':el.disabled=true;try{await loadAll();render();toast('새로 불러왔습니다');}catch(x){toast(errMsg(x));el.disabled=false;}return;
    case 'back':S.open=false;document.querySelector('.sites').setAttribute('data-open','0');return;
    case 'contact-add':contactForm(null);return;
    case 'contact-edit':contactForm(byId(S.detail.contacts,id));return;
    case 'note-add':noteForm(el.dataset.type,id,null);return;
    case 'note-edit':closeModal();noteForm(null,null,byId(S.detail.notes,id));return;
    case 'notes-view':notesView(el.dataset.type,id);return;
    case 'basic-edit':basicForm(s);return;
    case 'visit-add':visitForm(null,false);return;
    case 'visit-add-any':visitForm(null,true);return;
    case 'visit-edit':visitForm(byId(S.detail.visits,id),false);return;
    case 'manager-add':managerForm(null);return;
    case 'manager-edit':managerForm(byId(S.managers,id));return;
    case 'person-add':personForm(null);return;
    case 'person-edit':personForm(byId(S.detail.people||[],id));return;
    case 'bld-sync':bldSync(S.siteId,el);return;
    case 'bld-all':bldAll(el);return;
    case 'client-set':clientSetForm(s);return;
    case 'imp-apply':impApply(el);return;
    case 'imp-cancel':S.imp=null;S.keepScroll=true;render();return;
    case 'go-imp':S.view='set';S.stab='xlsx';render();return;
    case 'equip-add':equipForm(null,el.dataset.kind);return;
    case 'equip-edit':equipForm(byId(S.detail.equip,id));return;
    case 'staff-edit':staffForm();return;
    case 'acct-add':acctAdd();return;
    case 'acct-menu':acctMenu(el.dataset.id);return;
    case 'site-add':siteForm(null);return;
    case 'site-edit':siteForm(byId(S.sites,id));return;
    case 'client-add':clientForm(null);return;
    case 'client-edit':clientForm(byId(S.clients,id));return;
    case 'hist-reload':loadHist(S.siteId,true);document.getElementById('detail').innerHTML=viewDetail();return;
    case 'names-reload':S.histNames=null;render();return;
    case 'audit-reload':S.audit=null;render();return;
    case 'photo-view':photoView(id);return;
    case 'install':doInstall();return;
    case 'code-toggle':var c=byId(S.codes,id);try{await q(sb.from('site_codes').update({active:!c.active}).eq('id',id));c.active=!c.active;S.keepScroll=true;render();toast(c.active?'다시 쓰도록 바꿨습니다':'숨겼습니다 (기존 기록은 그대로)');}catch(x){toast(errMsg(x));}return;
  }
});
/* 검색창은 그대로 두고 목록만 다시 그림 — 한글 입력(자음·모음 조합)이 끊기지 않도록 */
function refreshList(){var tmp=document.createElement('div');tmp.innerHTML=viewSites();
  ['.lcount','.lbody'].forEach(function(sel){var a=app.querySelector(sel),b=tmp.querySelector(sel);if(a&&b)a.innerHTML=b.innerHTML;});}
app.addEventListener('input',function(e){
  if(e.target.id==='q'){S.q=e.target.value;refreshList();}
});
app.addEventListener('change',async function(e){
  var t=e.target;
  if(t.id==='fc'){S.client=t.value;render();}
  else if(t.id==='su'){S.su=t.value;S.keepScroll=true;render();}
  else if(t.id==='impfile'&&t.files&&t.files[0]){var f=t.files[0];t.value='';impLoad(f);}
  else if(t.dataset.imp!==undefined&&S.imp){var r=S.imp.rows[Number(t.dataset.imp)];if(r){r.site=Number(t.value);r.auto=false;if(!r.site)r.auto=false;S.keepScroll=true;render();}}
  else if(t.id==='imp-bd'&&S.imp){S.imp.base=t.value;}
  else if(t.id==='imp-rem'&&S.imp){S.imp.remember=t.checked;}
  else if(t.dataset.as){var sid=Number(t.dataset.as);t.disabled=true;
    try{if(t.checked)await q(sb.from('site_assign').insert({user_id:S.su,site_id:sid}));else await q(sb.from('site_assign').delete().eq('user_id',S.su).eq('site_id',sid));
      await reloadMembers();S.keepScroll=true;render();}catch(x){toast(errMsg(x));t.checked=!t.checked;t.disabled=false;}}
});
app.addEventListener('submit',async function(e){
  var f=e.target;if(!f.dataset.code)return;e.preventDefault();var inp=f.querySelector('input');var v=inp.value.trim();if(!v)return;
  try{var mx=codes(f.dataset.code,true).reduce(function(m,c){return Math.max(m,c.sort);},0);
    var row=await q(sb.from('site_codes').insert({grp:f.dataset.code,label:v,sort:mx+1}).select().single());S.codes.push(row);S.keepScroll=true;render();toast('「'+v+'」을(를) 추가했습니다');}catch(x){toast(errMsg(x));}
});
sb.auth.onAuthStateChange(function(ev){if(ev==='SIGNED_OUT'&&S.me){S.me=null;stopIdle();showLogin('로그아웃되었습니다.');}});
window.addEventListener('focus',function(){if(S.me&&S.view==='dash'&&Date.now()-(S.lastLoad||0)>300e3){S.lastLoad=Date.now();loadAll().then(function(){S.keepScroll=true;render();}).catch(function(){});}});

/* ---------- 시작 ---------- */
try{localStorage.removeItem('chm-sites-lock');}catch(e){}
(async function(){
  app.innerHTML='<div class="loading">불러오는 중…</div>';
  try{var r=await sb.auth.getSession();if(r.data&&r.data.session)afterSignIn();else showLogin();}catch(e){showLogin(errMsg(e));}
})();
})();
