<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>사업장 도착 브리핑 · CHM</title>

<style>
:root{color-scheme:light dark;--paper:#f7f9fa;--surface:#fff;--line:#e3e8ea;--ink:#1a2228;--ink-2:#4a5560;--ink-3:#7a8690;--accent:#0e6b5b;--accent-soft:#e3f1ee;--bad:#b3261e;--warn-soft:#fdf1dc;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#14191c;--surface:#1d2428;--line:#2e383e;--ink:#eef2f4;--ink-2:#c2cbd1;--ink-3:#8b969e;--accent:#6fcbb4;--accent-soft:#1d3a34;--bad:#f08a84;--warn-soft:#3b2f15}}
:root[data-theme="dark"]{--paper:#14191c;--surface:#1d2428;--line:#2e383e;--ink:#eef2f4;--ink-2:#c2cbd1;--ink-3:#8b969e;--accent:#6fcbb4;--accent-soft:#1d3a34;--bad:#f08a84;--warn-soft:#3b2f15}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:620px;margin:0 auto;padding:16px 18px 60px}
.brand{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-3);margin-bottom:10px}
.brand b{display:inline-block;background:var(--accent);color:#fff;font-size:11px;padding:2px 6px;border-radius:6px;letter-spacing:.3px}
.gate{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 18px;margin-top:40px}
.gate h1{font-size:18px;margin:0 0 6px}
.gate p{margin:0 0 14px;color:var(--ink-2);font-size:14px}
.gate input{width:100%;font:inherit;font-size:24px;letter-spacing:.4em;text-align:center;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font-family:var(--mono)}
.gate button{width:100%;margin-top:12px;font:inherit;font-weight:600;padding:12px;border:0;border-radius:10px;background:var(--accent);color:#fff}
.gate button:disabled{opacity:.6}
.gate .err{color:var(--bad);font-size:13.5px;margin-top:10px;min-height:1.4em}
.gate .hint{font-size:12.5px;color:var(--ink-3);margin-top:12px}
.bh{padding:4px 0 12px;border-bottom:2px solid var(--accent)}
.bh .when{font-size:12.5px;color:var(--ink-3);margin:0 0 4px}
.bh h1{font-size:24px;line-height:1.2;margin:0 0 6px}
.bh .sub{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--ink-2)}
.chip{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--accent-soft);color:var(--accent)}
.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.quick a,.quick span{display:flex;flex-direction:column;align-items:center;padding:9px 4px;font-size:13px;line-height:1.25;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;color:var(--ink);font-weight:600}
.quick small{font-weight:400;color:var(--ink-3);font-size:11px;margin-top:2px}
.quick span{opacity:.5}
section{margin-top:20px}
section h2{font-size:15px;margin:0 0 8px;display:flex;align-items:baseline;gap:8px}
section h2 .n{font-size:12.5px;color:var(--ink-3);font-weight:500}
section h2 .upd{margin-left:auto;font-size:12px;color:var(--ink-3);font-weight:400}
.bx{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:flex;gap:10px;padding:10px 14px;border-top:1px solid var(--line);align-items:flex-start}
.row:first-child{border-top:0}
.row .l{flex:1;min-width:0}
.row .nm{font-weight:600}
.row .mt{font-size:13px;color:var(--ink-2)}
.row .dt{flex:none;width:52px;font-size:12.5px;color:var(--ink-3);font-family:var(--mono);padding-top:2px}
.row .pct{flex:none;font-weight:700;font-size:17px;font-family:var(--mono)}
.kv{display:grid;grid-template-columns:repeat(4,1fr);text-align:center}
.kv div{padding:10px 4px;border-left:1px solid var(--line)}
.kv div:first-child{border-left:0}
.kv b{display:block;font-size:20px;font-family:var(--mono);font-weight:600}
.kv span{font-size:11.5px;color:var(--ink-3)}
.pl{padding:9px 14px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-2);display:grid;gap:3px}
.pl b{color:var(--ink)}
.cb{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}
.cb i{display:block;height:100%;background:var(--accent)}
.nt{display:flex;gap:8px;padding:10px 12px;background:var(--warn-soft);border-radius:10px;margin-top:8px;font-size:13px}
.empty{padding:14px;color:var(--ink-3);text-align:center;font-size:13.5px}
.tel{flex:none;padding:5px 11px;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:12.5px;text-decoration:none;white-space:nowrap}
.old{color:var(--bad);font-size:12px}
.gh{display:flex;justify-content:space-between;padding:6px 14px;font-size:12px;font-weight:600;color:var(--ink-2);background:var(--paper);border-top:1px solid var(--line)}
.gh:first-child{border-top:0}
.gh span{font-weight:400;color:var(--ink-3)}
details.fold>summary{list-style:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary h2 .cv{margin-left:auto;color:var(--ink-3);font-size:13px;font-weight:400;transition:transform .15s}
details.fold>summary h2 .upd+.cv{margin-left:0}
details.fold:not([open])>summary h2{margin-bottom:0;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;align-items:center}
details.fold:not([open])>summary h2 .cv{transform:rotate(-90deg)}
.row.kr{padding:7px 14px;font-size:13.5px}
.row.kr .k{flex:none;width:88px;color:var(--ink-3);font-size:12.5px;padding-top:1px}
.row.kr .l{white-space:pre-wrap}
.muted{color:var(--ink-3)}
.foot{font-size:12px;color:var(--ink-3);margin-top:24px;line-height:1.6}
.loading{padding:60px 0;text-align:center;color:var(--ink-3)}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="loading">불러오는 중…</div></div>
<script>
(function(){
var SB_URL='https://dbymktwxokbvfshlztrg.supabase.co',SB_KEY='sb_publishable_RHDgmlGV-m946etnPHfXaw_vy2u8uCp',APP='../';

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

}
function bfold(key,title,extra,body,open){

function briefHist(H){
  var d8=function(x){x=String(x||'');return /^\d{4}-\d{2}-\d{2}$/.test(x)?x.slice(2).replace(/-/g,'.'):x;};

      return row(r.date,r.type||'점검',[(r.score!=null&&r.score!=='')?r.score+'점':'',(r.bad!=null&&r.bad!=='')?'미흡 '+r.bad+'건':'',r.inspector?'점검자 '+r.inspector:''],g?'<div class="pct"'+(/^[AB]/.test(g)?'':' style="color:var(--bad)"')+'>'+esc(g)+'</div>':'');}).join(''):none('점검 기록이 없습니다'));

function render(d){

  var bb=d.bldg||[];

  var vs=d.visits||[],lastV=vs[0],days=lastV?Math.round((Date.now()+9*3600e3-new Date(lastV.visit_date+'T00:00:00Z').getTime())/864e5):null;

  var yr=new Date().getFullYear(),kinds={},ko=[];(d.equip||[]).forEach(function(e){if(!kinds[e.kind]){kinds[e.kind]={q:0,old:null,desc:[]};ko.push(e.kind);}var k=kinds[e.kind];k.q+=e.qty||0;if(e.install_year&&(!k.old||e.install_year<k.old))k.old=e.install_year;var ds=[e.type,e.maker,e.capacity].filter(Boolean).join(' ');if(ds&&k.desc.length<3)k.desc.push(ds);});

    return '<div class="row"><div class="l"><div class="nm">'+esc(k)+' <span class="muted" style="font-weight:400">'+x.q+'대</span></div><div class="mt">'+esc(x.desc.join(' / '))+'</div></div>'+(age!=null?'<div class="pct" style="font-size:13px;font-weight:500;'+(age>=15?'color:var(--bad)':'color:var(--ink-3)')+'">'+x.old+'년'+(age>=15?' 노후':'')+'</div>':'')+'</div>';}).join(''):'<div class="empty">등록된 설비가 없습니다</div>')+'</div>',false);
  var H=d.history;
  h+=bfold('hist','기타 이력',(H?' <span class="n">점검 '+H.n_ins+' · 산재 '+H.n_acc+' · 교육 '+H.n_edu+'</span>'+(H.fetched_at?'<span class="upd">'+esc(kst(H.fetched_at).slice(0,5))+' 기준</span>':''):''),(H?briefHist(H):'<div class="bx"><div class="empty">이력을 불러오지 못했습니다. <a href="'+APP+'">앱</a>의 기타 이력 탭에서 확인하세요</div></div>'),false);
  h+=vh;
  h+='<p class="foot">이 링크는 '+esc(kst(d.expires_at))+'까지 열립니다 · 보기 전용. 방문기록 작성·수정은 <a href="'+APP+'">사업장 관리 앱</a>에서.</p>';
  app.innerHTML=h;window.scrollTo(0,0);
}
var saved=null;try{saved=sessionStorage.getItem(pinKey);}catch(e){}
if(saved)load(saved);else gate('');
})();
